name: GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html favicon.png apple-touch-icon.png .nojekyll _site/

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
