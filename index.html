  return `
  <div class="page-head"><div><h1>Sessionmarkt</h1><p class="lead">Für Projekttage, Stationenlernen oder Fortbildungen: Sessions in Runden anbieten, Plätze begrenzen, Anmeldungen sammeln. Ist eine Session voll, landen weitere Namen automatisch auf der Warteliste.</p></div>
    <div class="row">${on ? `${focusBtn('stage')}<button class="btn" data-action="stage-hide">Am Beamer ausblenden</button>` : `<button class="btn primary lg" data-action="mk-show" ${m.sessions.length ? '' : 'disabled'}>${icon('screen')}Am Beamer zeigen</button>`}</div>
  </div>
  <datalist id="mkNames">${c ? presentStudents(c).sort(byFirst).map(s => `<option value="${esc(displayName(s, c))}">`).join('') : ''}</datalist>
  <div class="grid">
    <section class="panel s7">
      <div class="panel-head"><h2>Einstellungen</h2><span class="muted small">${total} angemeldet${waiting ? `, ${waiting} auf Wartelisten` : ''}</span></div>
      <div class="stack">
        <label class="field"><span>Titel</span><input type="text" value="${esc(m.title)}" data-change="mk-set" data-field="title"></label>
        <label class="field"><span>Hinweis unter dem Titel</span><input type="text" value="${esc(m.intro)}" data-change="mk-set" data-field="intro"></label>
        <label class="check"><input type="checkbox" data-change="mk-flag" data-field="one" ${m.one ? 'checked' : ''}><span>Pro Runde nur eine Session je Person (eine neue Anmeldung ersetzt die alte)</span></label>
        <label class="check"><input type="checkbox" data-change="mk-flag" data-field="input" ${m.input ? 'checked' : ''}><span>Anmeldung direkt am Beamer (Touch-Display oder interaktive Tafel)</span></label>
        <label class="check"><input type="checkbox" data-change="mk-flag" data-field="qr" ${m.qr ? 'checked' : ''}><span>QR-Codes auf den Karten zeigen, wenn ein Link eingetragen ist</span></label>
        ${m.rounds.length > 1 ? `<div class="setting" style="margin:0"><span>Ansicht am Beamer</span>${seg('mk-view', views, m.view)}</div>` : ''}
        <div class="row">
          <button class="btn" data-action="mk-export" ${total + waiting ? '' : 'disabled'}>Anmeldungen als CSV</button>
          <button class="btn danger" data-action="mk-clear" ${total + waiting ? '' : 'disabled'}>Alle Anmeldungen löschen</button>
          ${m.sessions.length ? '' : '<button class="btn ghost" data-action="mk-demo">Beispiel laden</button>'}
        </div>
      </div>
    </section>
    <section class="panel s5">
      <div class="panel-head"><h2>Runden</h2></div>
      ${m.rounds.length ? `<div class="list-rows">${m.rounds.map(r => `<div class="lr nocheck">
        <input type="text" value="${esc(r.label)}" data-change="mk-round-edit" data-field="label" data-rid="${r.id}" aria-label="Name der Runde">
        <input type="text" value="${esc(r.time)}" placeholder="10:00–10:45" data-change="mk-round-edit" data-field="time" data-rid="${r.id}" aria-label="Zeit">
        <button class="btn ghost small danger" data-action="mk-round-del" data-rid="${r.id}" aria-label="Runde löschen">×</button>
      </div>`).join('')}</div>` : '<p class="muted">Lege zuerst eine Runde an, zum Beispiel „Runde 1“ mit Zeit.</p>'}
      <form class="row nowrap" data-submit="mk-round-add" style="margin-top:12px">
        <input type="text" name="label" placeholder="Runde ${m.rounds.length + 1}" aria-label="Name der Runde">
        <input type="text" name="time" placeholder="10:00–10:45" aria-label="Zeit" style="max-width:140px">
        <button class="btn primary">Runde anlegen</button>
      </form>
    </section>
    ${m.rounds.map(r => {
      const ss = m.sessions.filter(s => s.roundId === r.id);
      return `<section class="panel s12">
        <div class="panel-head"><h2>${esc(r.label)}${r.time ? ` · ${esc(r.time)}` : ''}</h2><button class="btn small" data-action="mk-session-add" data-rid="${r.id}">+ Session</button></div>
        ${ss.length ? `<div class="mk-editor-grid">${ss.map(s => mkSessionEditor(s, m)).join('')}</div>` : '<p class="muted">Noch keine Session in dieser Runde.</p>'}
      </section>`;
    }).join('')}
  </div>`;
}

  const on = !!x && x.sid === i.id, done = store.strats.noRepeat && store.strats.drawn.includes(i.id);
  return `<li class="strat-item ${on ? 'on' : ''}">
    <div class="strat-fields">
      <input type="text" class="strat-name" value="${esc(i.name)}" data-change="strat-edit" data-field="name" data-id="${i.id}" aria-label="Name der Strategie">
      <textarea rows="2" data-change="strat-edit" data-field="text" data-id="${i.id}" aria-label="Erläuterung">${esc(i.text)}</textarea>
      <input type="text" value="${esc(i.link)}" placeholder="Link zu mehr Informationen (optional)" data-change="strat-edit" data-field="link" data-id="${i.id}" aria-label="Link" inputmode="url" spellcheck="false">
    </div>
    <div class="strat-actions">
      ${on ? '<span class="strat-tag">Strategie des Tages</span>' : `<button class="btn small primary" data-action="strat-pick" data-id="${i.id}">Als Strategie des Tages</button>`}
      ${done && !on ? '<span class="muted small">schon dran gewesen</span>' : ''}
      ${i.link ? `<a class="btn ghost small" href="${esc(i.link)}" target="_blank" rel="noopener">Link öffnen</a>` : ''}
      <button class="btn ghost small danger" data-action="strat-del" data-id="${i.id}">Löschen</button>
    </div>
  </li>`;
}

    </section>
  </div>`;
}

function openStudentDialog(id) {
  const c = activeClass(), s = c && c.students.find(x => x.id === id);
  if (!s) return;
  rt.dlgStudent = id;
  const absent = s.absentOn === todayKey();
  const week = cardCountsMap(c.id, 'week')[id] || { green: 0, yellow: 0, red: 0 };
  const today = store.cards.filter(k => k.studentId === id && inRange(k.t, 'today')).sort((a, b) => b.t - a.t);
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dlg">
    <div class="dlg-head">
      <div><h2 class="dlg-title">${esc(fullName(s))}</h2><p class="muted small">${absent ? 'Heute als abwesend markiert. ' : ''}Diese Woche: ${week.green} Lob, ${week.yellow} Gelb, ${week.red} Rot</p></div>
      <button class="iconbtn" data-action="dlg-close" aria-label="Schließen">×</button>
    </div>
    <label class="field"><span>Notiz (optional, nur für dich)</span><textarea id="cardNote" rows="2" placeholder="Was ist passiert?"></textarea></label>
    <label class="check"><input type="checkbox" id="cardShow" ${store.settings.showCardsOnBeamer ? 'checked' : ''}><span>Am Beamer zeigen</span></label>
    <div class="card-buttons">
      <button class="cardbtn green" data-action="give-card" data-type="green"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS.star}</svg><span>Lob</span></button>
      <button class="cardbtn yellow" data-action="give-card" data-type="yellow"><span>Gelbe Karte</span></button>
      <button class="cardbtn red" data-action="give-card" data-type="red"><span>Rote Karte</span></button>
    </div>
    <div class="row">
      <button class="btn" data-action="call-student">Am Beamer aufrufen</button>
      <button class="btn ghost" data-action="toggle-absent">${absent ? 'Doch anwesend' : 'Heute abwesend'}</button>
    </div>
    ${today.length ? `<h3>Heute</h3><ul class="log">${today.map(k => `<li><span class="badge ${k.type}" aria-hidden="true"></span><div class="log-main"><div>${CARD[k.type].long} <span class="muted small">${fmtWhen(k.t)}</span></div>${k.note ? `<div class="log-note">${esc(k.note)}</div>` : ''}</div></li>`).join('')}</ul>` : ''}
  </div>`;
  if (!dlg.open) dlg.showModal();
}

  'note-edit': el => { const m = store.media.find(x => x.id === el.dataset.id); if (m) { m.text = el.value; save(); pushState(); } },
  'bd-flag': el => { const b = boardOf(el.dataset.kind); if (b) { b[el.dataset.field] = el.checked; commit(); } },
  'bd-sec-on': el => {
    const b = boardOf(el.dataset.kind), x = secOf(el.dataset.kind, el.dataset.sec);
    if (!x) return;
    x.on = el.checked;
    if (!x.on && b.view === x.id) b.view = 'all';
    commit();
  },
  'bd-sec-flag': el => { const x = secOf(el.dataset.kind, el.dataset.sec); if (x) { x[el.dataset.field] = el.checked; commit(); } },
  'bd-sec-edit': el => { const x = secOf(el.dataset.kind, el.dataset.sec); if (x) { x[el.dataset.field] = el.value.trim(); softRender(); } },
  'bd-sec-url': el => {
    const x = secOf(el.dataset.kind, el.dataset.sec), v = el.value.trim();
    if (!x) return;
    if (v && !normalizeUrl(v)) { toast('Das sieht nicht wie eine Webadresse aus.'); return; }
    x.url = v ? normalizeUrl(v) : '';
    commit();
  },
  'bd-item': el => {
    const x = secOf(el.dataset.kind, el.dataset.sec), it = x && x.items.find(i => i.id === el.dataset.item);
    if (!it) return;
    if (el.type === 'checkbox') { it.done = el.checked; commit(); }
    else { it[el.dataset.field] = el.value.trim(); save(); pushState(); }
  },
  'mk-set': el => { store.market[el.dataset.field] = el.value.trim(); save(); pushState(); },
  'mk-flag': el => { store.market[el.dataset.field] = el.checked; commit(); },
  'mk-round-edit': el => { const r = store.market.rounds.find(x => x.id === el.dataset.rid); if (r) { r[el.dataset.field] = el.value.trim(); softRender(); } },
  'mk-edit': el => {
    const s = store.market.sessions.find(x => x.id === el.dataset.sid), f = el.dataset.field;
    if (!s) return;
    if (f === 'cap') { s.cap = clamp(Math.round(+el.value) || 1, 1, 999); mkPromote(s); commit(); return; }
    if (f === 'link') {
      const v = el.value.trim();
      if (v && !normalizeUrl(v)) { toast('Das sieht nicht wie eine Webadresse aus.'); return; }
      s.link = v ? normalizeUrl(v) : '';
      commit();
      return;
    }
    if (f === 'roundId') { s.roundId = el.value; commit(); return; }
    s[f] = el.value.trim();
    save();
    pushState();
  },
  'class-select': el => { store.activeClassId = el.value; rt.streakSec = 0; rt.recordAnnounced = false; commit(); },
  'pick-norepeat': el => { store.settings.pickNoRepeat = el.checked; commit(); },
  'set-bool': el => { store.settings[el.dataset.key] = el.checked; commit(); },
  'noise-showlevel': el => { store.settings.noise.showLevel = el.checked; save(); pushState(); },
  mps: el => { store.settings.minutesPerStar = clamp(Math.round(+el.value) || 5, 1, 60); commit(); },
  'goal-target': el => {
    const g = activeClass().reward.goal;
    g.target = clamp(Math.round(+el.value) || 0, 0, 500);
    g.reachedAt = null;
    commit();
  },
  'goal-reward': el => { activeClass().reward.goal.reward = el.value.trim(); commit(); },
  'class-rename': el => { const c = activeClass(); if (el.value.trim()) c.name = el.value.trim(); commit(); },
  'stu-edit': el => {
    const s = activeClass().students.find(x => x.id === el.dataset.id);
    if (s) { s[el.dataset.field] = el.value.trim(); save(); pushState(); }
  },
  'csv-file': el => { const f = el.files[0]; if (f) readImportFile(f); el.value = ''; },
  'imp-map': el => { rt.imp.map[+el.dataset.col] = el.value; renderAll(); },
  'imp-header': el => { rt.imp.hasHeader = el.checked; renderAll(); },
  'imp-target': el => { rt.imp.target = el.value; renderAll(); },
  'imp-class': el => { rt.imp.classId = el.value; rt.imp.target = 'existing'; renderAll(); },
  'backup-file': async el => {
    const f = el.files[0];
    el.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || !Array.isArray(data.classes)) throw new Error('kein Backup');
      rt.pendingBackup = { data, name: f.name };
      renderAll();
    } catch (e) { toast('Diese Datei ist kein Backup des Teaching Assistant.'); }
  },
};

function syncThresholdUI() {
  const s = store.settings.noise;
  $$('.meter').forEach(m => { m.style.setProperty('--y', s.yellow + '%'); m.style.setProperty('--r', s.red + '%'); });
  const set = (key, value, text) => {
    const input = $(`[data-input="${key}"]`), out = $(`[data-out="${key}"]`);
    if (input && +input.value !== value) input.value = value;
    if (out) out.textContent = text;
  };
  set('th-yellow', s.yellow, s.yellow);
  set('th-red', s.red, s.red);
  set('sens', s.sensitivity, (s.sensitivity > 0 ? '+' : '') + s.sensitivity);
  set('tol', s.toleranceSec, fmtNum(s.toleranceSec) + ' Sek.');
  save();
  pushState();
}
const inputs = {
  message: el => { store.message = el.value; save(); pushState(); },
  'timer-label': el => { store.timer.label = el.value; save(); pushState(); },
  'note-live': el => {
    const m = store.media.find(x => x.id === el.dataset.id);
    if (!m) return;
    m.text = el.value;
    save();
    pushState();
    if (rt.preview) rt.preview.show(stageDesc());
  },
  'imp-newname': el => { rt.imp.newName = el.value; },
  'th-yellow': el => { const s = store.settings.noise; s.yellow = +el.value; if (s.red < s.yellow + 3) s.red = Math.min(100, s.yellow + 3); syncThresholdUI(); },
  'th-red': el => { const s = store.settings.noise; s.red = +el.value; if (s.yellow > s.red - 3) s.yellow = Math.max(0, s.red - 3); syncThresholdUI(); },
  sens: el => { store.settings.noise.sensitivity = +el.value; syncThresholdUI(); },
  tol: el => { store.settings.noise.toleranceSec = +el.value; syncThresholdUI(); },
};
const submits = {
  'vocab-add': f => { const input = f.elements.word, text = input.value; input.value = ''; input.focus(); addVocab(text); },
  'q-box-add': f => {
    const name = f.elements.name.value.trim();
    if (!name) return;
    const b = newBox(name);
    store.qboxes.push(b);
    store.activeBoxId = b.id;
    commit();
    toast(`Fragenbox ${name} angelegt. Füge jetzt deine Fragen ein.`);
  },
  'q-add': f => {
    const b = activeBox();
    if (!b) return;
    const n = addQuestions(b, f.elements.text.value);
    if (!n) { toast('Keine neuen Fragen erkannt. Schreibe eine Frage pro Zeile.'); return; }
    commit();
    toast(`${n} ${n === 1 ? 'Frage' : 'Fragen'} hinzugefügt.`);
  },
  'web-add': f => { const item = addWeb(f.elements.url.value, f.elements.title.value); if (item) showMedia(item.id); },
  'strat-add': f => {
    const name = f.elements.name.value.trim();
    if (!name) return;
    let link = f.elements.link.value.trim();
    if (link) { link = normalizeUrl(link); if (!link) { toast('Der Link sieht nicht wie eine Webadresse aus.'); return; } }
    store.strats.items.push({ id: uid(), name, text: f.elements.text.value.trim(), link: link || '' });
    commit();
    toast(`${name} ist jetzt in der Bibliothek.`);
  },
  'note-add': f => {
    const text = f.elements.text.value.trim(), title = f.elements.title.value.trim();
    if (!text) return;
    const m = { id: uid(), kind: 'note', cat: 'note', name: title || text.split(/\r?\n/)[0].slice(0, 48), title, text, t: Date.now() };
    store.media.unshift(m);
    showMedia(m.id);
  },
  'bd-card-add': f => {
    boardCard(f.dataset.kind, f.dataset.sec, f.elements.text.value, false);
    const inp = $(`[data-submit="bd-card-add"][data-sec="${f.dataset.sec}"] input`);
    if (inp) inp.focus();
  },
  'mk-round-add': f => {
    const m = store.market;
    m.rounds.push({ id: uid(), label: f.elements.label.value.trim() || `Runde ${m.rounds.length + 1}`, time: f.elements.time.value.trim() });
    commit();
  },
  'mk-signup': f => {
    if (!f.elements.name.value.trim()) return;
    marketSignup(f.dataset.sid, f.elements.name.value, false);
    const inp = $(`[data-submit="mk-signup"][data-sid="${f.dataset.sid}"] input`);
    if (inp) inp.focus();
  },
  'class-add': f => {
    const name = f.elements.name.value.trim();
    if (!name) return;
    if (store.classes.some(k => k.name.toLowerCase() === name.toLowerCase())) { toast(`Eine Klasse ${name} gibt es schon.`); return; }
    const c = newClass(name);
    store.classes.push(c);
    store.activeClassId = c.id;
    commit();
    toast(`Klasse ${name} angelegt.`);
  },
  'stu-add': f => {
    const c = activeClass();
    const lines = f.elements.names.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    lines.forEach(l => { const { first, last } = splitFull(l); c.students.push({ id: uid(), first, last }); });
    c.students.sort(byLast);
    commit();
    if (lines.length) toast(`${lines.length} ${lines.length === 1 ? 'Person' : 'Personen'} hinzugefügt.`);
  },
  'timer-custom': f => {
    const sec = (+f.elements.min.value || 0) * 60 + (+f.elements.sec.value || 0);
    if (sec < 1) { toast('Gib eine Zeit von mindestens einer Sekunde ein.'); return; }
    timerSet(sec);
  },
};

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (el && !el.disabled && actions[el.dataset.action]) { e.preventDefault(); actions[el.dataset.action](el, e); return; }
    const dlg = $('#dlg');
    if (e.target === dlg) dlg.close();   // Klick auf den Hintergrund
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && changes[el.dataset.change]) changes[el.dataset.change](el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && inputs[el.dataset.input]) inputs[el.dataset.input](el, e); });
  document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (f) { e.preventDefault(); submits[f.dataset.submit](f); } });
  document.addEventListener('toggle', e => {
    if (!e.target.matches || !e.target.matches('details')) return;
    if (e.target.matches('[data-diag]')) rt.diagOpen = e.target.open;
    else rt.pasteOpen = e.target.open;
  }, true);
  $('#dlg').addEventListener('close', () => { rt.dlgStudent = null; });

  // Dateien nur in der Ablagefläche annehmen, sonst würde der Browser sie öffnen
  window.addEventListener('dragover', e => {
    e.preventDefault();
    $$('.drop').forEach(d => d.classList.toggle('over', d.contains(e.target)));
  });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) $$('.drop').forEach(d => d.classList.remove('over')); });
  window.addEventListener('drop', e => {
    e.preventDefault();
    const zone = e.target.closest && e.target.closest('.drop');
    $$('.drop').forEach(d => d.classList.remove('over'));
    const files = [...e.dataTransfer.files];
    if (!zone || !files.length) return;
    if (zone.dataset.drop === 'media') addFiles(files);
    else if (zone.dataset.drop === 'questions') importQuestionsFile(files[0]);
    else readImportFile(files[0]);
  });

  document.addEventListener('pointerdown', () => getAudio(), { once: true });
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', () => {
    diagLog(document.hidden ? 'Fenster verdeckt' : 'Fenster sichtbar');
    if (document.hidden) saveNow();
  });

  darkQuery.addEventListener('change', () => { if (store.settings.uiTheme === 'auto') renderAll(); });
  // Tastenkürzel, solange nicht in ein Feld getippt wird
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || $('#dlg').open || e.target.closest('input, textarea, select')) return;
    const key = e.key.toLowerCase();
    if (key === 'z') { e.preventDefault(); pickRandom(); }
    else if (key === ' ' && !e.target.closest('button, a, summary, label')) { e.preventDefault(); timerToggle(); }
    else if (key === 'q') { e.preventDefault(); drawQuestion(); }
    else if ((e.key === 'ArrowRight' || e.key === 'PageDown') && store.stage) { if (stagePage(1)) e.preventDefault(); }
    else if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && store.stage) { if (stagePage(-1)) e.preventDefault(); }
    else if (e.key === 'Escape' && store.focus) { store.focus = null; commit(); }
    else if (key === 'v') { const input = $('[data-focus-key="vocab"]'); if (input) { e.preventDefault(); input.focus(); } }
  });
  // Änderungen vom Beamer, die während des Tippens kamen, nachholen
  document.addEventListener('focusout', e => {
    if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('button, a, label, summary')) return;
    setTimeout(() => {
      const a = document.activeElement;
      if (rt.needRender && !(a && a.matches && a.matches('input, textarea, select') && $('#page').contains(a))) { rt.needRender = false; renderAll(); }
    }, 0);
  });
  const previewHost = document.createElement('div');
  previewHost.className = 'mv mv-preview';
  rt.preview = new Viewer(previewHost, { preview: true, getBlob: id => FileStore.get(id), onInfo: info => setStageInfo(rt.preview.d && rt.preview.d.id, info) });
  FileStore.open();
  listen(onDashMessage);
  renderAll();
  setInterval(engineTick, 100);
}

function applyState(st) {
  B.st = st;
  B.lastAt = Date.now();
  const root = $('#bm');
  root.dataset.theme = st.theme;
  $('#bmClass').textContent = st.className;
  const msg = $('#bmMsg');
  msg.textContent = st.message;
  msg.hidden = !st.message.trim();

  const n = st.noise;
  root.classList.toggle('no-ampel', n.source === 'off');
  $('#housing').dataset.light = n.light;
  const showLevel = n.source === 'mic' && n.showLevel;
  $('#levelbar').hidden = !showLevel;
  if (showLevel) {
    $('#lvlFill').style.height = clamp(n.level, 0, 100) + '%';
    $('#mkY').style.bottom = n.yellow + '%';
    $('#mkR').style.bottom = n.red + '%';
  }
  if (n.light === 'red' && B.lastLight !== 'red' && B.lastLight !== 'off') shakeStar();
  B.lastLight = n.light;

  const vb = st.vocab;
  root.classList.toggle('vocab-on', !!vb);
  if (vb) {
    $('#bmVocabLang').textContent = vb.lang;
    const key = JSON.stringify(vb.items);
    if (key !== B.vocabKey) {
      const top = vb.items[0] ? vb.items[0].id : '', fresh = top !== B.vocabTop;
      B.vocabKey = key;
      B.vocabTop = top;
      const cell = (v, pending) => v ? esc(v) : pending ? '…' : '';
      $('#bmVocabList').innerHTML = vb.items.map((i, k) => `<li class="${k === 0 ? 'latest' : ''}${k === 0 && fresh ? ' new' : ''}"><div class="fx">${cell(i.fx, i.pending)}</div><div class="de">${cell(i.de, i.pending)}</div></li>`).join('');
    }
  }

  const sd = st.stage, qBox = $('#bmQuestion'), mBox = $('#bmMedia'), bBox = $('#bmBoard');
  const sk = !sd ? '' : sd.kind === 'board' || sd.kind === 'market' ? 'board' : sd.kind;
  root.classList.toggle('stage-on', !!sd);
  root.classList.toggle('board-on', sk === 'board');
  qBox.hidden = sk !== 'question';
  mBox.hidden = sk !== 'media';
  bBox.hidden = sk !== 'board';
  B.viewer.show(sk === 'media' ? sd : null);
  if (sk === 'question') renderQuestion(sd); else B.qKey = '';
  if (sk === 'board') renderBoard(sd); else { B.bKey = ''; if (!$('#bmInput').hidden) closeInput(); }
  applyFocus(st);

  const r = st.reward;
  $('#bmBottom').hidden = !r;
  if (!r) return;
  $('#bmStarTotal').textContent = r.total;
  $('#bmStarUnit').textContent = r.total === 1 ? 'Stern' : 'Sterne';
  $('#bmStarFill').style.transform = `scaleY(${r.progress})`;
  $('#bmStarStatus').textContent = starStatus(n.source, n.light, r.nextInSec, r.yellowPolicy, r.redPolicy);
  renderGoal(r);
  $('#bmLiga').innerHTML = r.rank ? `<strong>Platz ${r.rank}</strong>von ${r.classes} Klassen` : '';
}
function renderGoal(r) {
  const box = $('#bmGoal');
  box.hidden = !r.goalTarget;
  if (!r.goalTarget) return;
  const done = Math.min(r.goalDone, r.goalTarget);
  $('#bmGoalTitle').textContent = r.goalReached
    ? `Ziel erreicht${r.goalReward ? ': ' + r.goalReward : '!'}`
    : r.goalReward ? `Ziel: ${r.goalReward}` : 'Unser Klassenziel';
  const key = `${done}/${r.goalTarget}`;
  if (B.goalKey === key) return;
  B.goalKey = key;
  const count = `<span class="goal-count">${done} / ${r.goalTarget}</span>`;
  if (r.goalTarget <= 40) {
    const cols = r.goalTarget <= 10 ? r.goalTarget : r.goalTarget <= 20 ? 10 : 20;
    const max = r.goalTarget <= 10 ? 6 : r.goalTarget <= 20 ? 5 : 3.4;
    $('#bmGoalTrack').innerHTML = `<div class="slots" style="--cols:${cols};--max:${max}vmin">${Array.from({ length: r.goalTarget }, (_, i) => `<svg class="slot ${i < done ? 'on' : ''}" viewBox="0 0 100 100" aria-hidden="true"><polygon points="${STAR_POINTS}"/></svg>`).join('')}</div>${count}`;
  } else {
    $('#bmGoalTrack').innerHTML = `<div class="goal-bar"><span style="width:${done / r.goalTarget * 100}%"></span></div>${count}`;
  }
}

function beamerTick() {
  const now = new Date();
  const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  setText('bmHM', hm);
  setText('bmS', pad(now.getSeconds()));
  setText('bmTime', hm);
  $('#bmDate').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const root = $('#bm'), t = B.st && B.st.timer, on = !!t && t.state !== 'idle';
  root.classList.toggle('timer-on', on);
  if (t && (on || root.dataset.focus === 'timer')) {
    const rem = timerRemaining(t);
    const digits = fmtDur(rem);
    setText('bmTimerDigits', digits);
    $('#bmTimer').classList.toggle('long', digits.length > 5);
    $('#bmTimerBar').style.width = (t.durationSec ? clamp(rem / t.durationSec, 0, 1) * 100 : 0) + '%';
    $('#bmTimerLabel').textContent = t.label || '';
    $('#bmTimerState').textContent = t.state === 'paused' ? 'Pausiert' : t.state === 'done' ? 'Die Zeit ist um' : '';
    const box = $('#bmTimer');
    box.classList.toggle('end', rem <= 10);
    box.classList.toggle('warn', rem > 10 && rem <= 60 && t.durationSec >= 180);
    box.classList.toggle('paused', t.state === 'paused');
    box.classList.toggle('running', t.state === 'running');
    const tt = $('#bmTopTimer');
    if (tt.textContent !== digits) tt.textContent = digits;
    tt.classList.toggle('end', rem <= 10);
    tt.classList.toggle('warn', rem > 10 && rem <= 60 && t.durationSec >= 180);
  }
  const stale = !B.lastAt || Date.now() - B.lastAt > 5000;
  root.classList.toggle('stale', stale);
  $('#bmHint').hidden = !stale;
}

function showOverlay(html, ms = 9000, cls = '') {
  clearTimeout(B.overlayTimer);
  clearTimeout(B.rollTimer);
  const ov = $('#bmOverlay');
  ov.className = 'bm-overlay show ' + cls;
  ov.innerHTML = html;
  if (ms) B.overlayTimer = setTimeout(hideOverlay, ms);
}
function hideOverlay() {
  clearTimeout(B.overlayTimer);
  clearTimeout(B.rollTimer);
  const ov = $('#bmOverlay');
  ov.className = 'bm-overlay';
  ov.innerHTML = '';
}
function overlayPick({ name, roll }) {
  showOverlay('<div><div class="ov-small">Du bist dran</div><div class="ov-name" id="rollName"></div></div>', 0);
  const el = $('#rollName'), small = $('#bmOverlay .ov-small');
  const finish = () => {
    el.textContent = name;
    el.className = 'ov-name final';
    small.style.visibility = 'visible';
    B.overlayTimer = setTimeout(hideOverlay, 9000);
  };
  if (!roll || roll.length < 2 || REDUCED_MOTION) { finish(); return; }
  small.style.visibility = 'hidden';
  el.className = 'ov-name rolling';
  const start = performance.now(), total = 2300;
  let i = 0;
  (function step() {
    const t = performance.now() - start;
    if (t >= total) { finish(); return; }
    el.textContent = roll[i++ % roll.length];
    B.rollTimer = setTimeout(step, 55 + Math.pow(t / total, 2) * 300);
  })();
}
function overlayCard({ type, name }) {
  const kind = { green: 'Lob!', yellow: 'Gelbe Karte', red: 'Rote Karte' }[type];
  const inner = type === 'green' ? `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.star}</svg>` : '';
  showOverlay(`<div class="ov-card"><div class="ref-card ${type}">${inner}</div><div class="ov-card-text"><div class="ov-name">${esc(name)}</div><div class="ov-card-kind">${kind}</div></div></div>`, 7000);
}
function overlayGoal({ reward, target }) {
  showOverlay(`<div class="ov-goal">${starSVG({ clip: 'clipGoal' })}<div class="ov-big">Ziel erreicht!</div><div class="ov-sub">${reward ? esc(reward) : `${target} Sterne gesammelt`}</div></div>`, 14000);
  confetti();
}
function overlayTimerEnd({ label }) {
  showOverlay(`<div><div class="ov-big">Die Zeit ist um</div>${label ? `<div class="ov-sub">${esc(label)}</div>` : ''}</div>`, 8000);
}
function overlayLiga({ subtitle, rows }) {
  const max = Math.max(1e-9, ...rows.map(r => r.value));
  showOverlay(`<div class="ov-liga"><h2>Klassen-Liga</h2><div class="ov-small">${esc(subtitle)}</div>${rows.map((r, i) => `<div class="liga-row ${r.me ? 'me' : ''}"><span class="liga-rank">${i + 1}.</span><span class="liga-name">${esc(r.name)}</span><span class="liga-bar"><span style="width:${r.value / max * 100}%"></span></span><span class="liga-val">${esc(r.label)}</span></div>`).join('')}</div>`, 16000, 'liga');
}
function bmToast(text) {
  const el = document.createElement('div');
  el.className = 'bm-toast';
  el.textContent = text;
  $('#bmToasts').appendChild(el);
  setTimeout(() => el.remove(), 6000);
}
function starPop(n) {
  const box = $('#bmStar');
  if (!box) return;
  box.classList.remove('pop');
  void box.offsetWidth;
  box.classList.add(n > 0 ? 'pop' : 'shake');
  const plus = document.createElement('span');
  plus.className = 'plus' + (n < 0 ? ' minus' : '');
  plus.textContent = n > 0 ? `+${n}` : `−${-n}`;
  box.appendChild(plus);
  setTimeout(() => { plus.remove(); box.classList.remove('pop', 'shake'); }, 1600);
}
function shakeStar() {
  const box = $('#bmStar');
  if (!box) return;
  box.classList.remove('shake');
  void box.offsetWidth;
  box.classList.add('shake');
  setTimeout(() => box.classList.remove('shake'), 600);
}
function confetti() {
  if (REDUCED_MOTION) return;
  const cv = $('#bmConfetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const colors = ['#F3BE5C', '#8FB0E8', '#5CC98A', '#F26B55', '#FFFFFF'];
  const parts = Array.from({ length: 190 }, (_, i) => ({
    x: Math.random() * W, y: -Math.random() * H * .6,
    vx: (Math.random() - .5) * 5 * dpr, vy: (2 + Math.random() * 4) * dpr,
    w: (6 + Math.random() * 8) * dpr, h: (4 + Math.random() * 5) * dpr,
    a: Math.random() * Math.PI, va: (Math.random() - .5) * .3, c: colors[i % colors.length],
  }));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .06 * dpr; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (t - start < 5000) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, W, H);
  })(start);
}
function handleEvent(name, d) {
  if (name === 'pick') overlayPick(d);
  else if (name === 'card') overlayCard(d);
  else if (name === 'goal') overlayGoal(d);
  else if (name === 'timerEnd') overlayTimerEnd(d);
  else if (name === 'liga') overlayLiga(d);
  else if (name === 'record') bmToast(`Neuer Ruhe-Rekord! Länger als ${fmtDur(d.sec)} Minuten am Stück leise`);
  else if (name === 'star') starPop(d.n);
  else if (name === 'hide') hideOverlay();
  else if (name === 'file') { const cb = B.pending.get(d.id); if (cb) { B.pending.delete(d.id); cb(d.blob || null); } }
  else if (name === 'notice') bmToast(d.text);
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
}

function initHostedHint() {
  document.body.classList.add('dash');
  document.documentElement.dataset.ui = darkQuery.matches ? 'dark' : 'light';
  $('#app').innerHTML = `<main class="page"><div class="empty" data-hosted>
    <h1>Erst laden, dann öffnen</h1>
    <p class="lead">Der Teaching Assistant läuft auf deinem Rechner, nicht auf classtiles.de. Lade die Datei herunter und öffne sie am besten in Chrome. Deine Klassen bleiben dann in deinem Browser.</p>
    <div class="row">
      <a class="btn primary lg" href="${esc(location.pathname)}" download="teaching-assistant.html">Datei laden</a>
      <a class="btn lg" href="https://classtiles.de/ki-teaching-assistant.html">Zur Beschreibung</a>
    </div>
  </div></main>`;
}

const FOCUS_SEL = { stage: '#bmStage', timer: '#bmTimer', clock: '.bm-clock', ampel: '.bm-ampel', stars: '#bmBottom', message: '#bmMsg', vocab: '.bm-vocab' };
function applyFocus(st) {
  const root = $('#bm'), f = st.focus;
  const ok = f && FOCUS_SEL[f] && !(
    (f === 'stage' && !st.stage) || (f === 'message' && !st.message.trim()) || (f === 'vocab' && !st.vocab)
    || (f === 'stars' && !st.reward) || (f === 'ampel' && st.noise.source === 'off'));
  const target = ok ? $(FOCUS_SEL[f]) : null;
  $$('.is-focus', root).forEach(el => { if (el !== target) el.classList.remove('is-focus'); });
  if (target) target.classList.add('is-focus');
  root.classList.toggle('focusing', !!target);
  root.dataset.focus = target ? f : '';
}
function renderQuestion(q) {
  const box = $('#bmQuestion'), key = `${q.draw}|${q.q}|${q.a}|${q.box}`;
  if (B.qKey !== key) {
    const fresh = B.qDraw !== q.draw, len = q.q.length;
    B.qKey = key;
    B.qDraw = q.draw;
    box.innerHTML = `<div class="q-card ${fresh ? 'new' : ''}"><div class="q-head"><span class="q-badge">${icon('question')}Zufallsfrage</span><span class="q-box"></span></div>
      <div class="q-text ${len < 50 ? 'xl' : len < 120 ? 'l' : len < 240 ? 'm' : 's'}"></div>
      <div class="q-answer" hidden><span class="q-answer-label">Antwort</span><div class="q-answer-text"></div></div></div>`;
    box.querySelector('.q-box').textContent = q.box;
    box.querySelector('.q-text').textContent = q.q;
    box.querySelector('.q-answer-text').textContent = q.a;
  }
  box.querySelector('.q-answer').hidden = !(q.showAnswer && q.a);
}
// Dateien holt der Beamer beim Dashboard ab und merkt sich die letzten paar
function requestFile(id) {
  if (B.files.has(id)) return Promise.resolve(B.files.get(id));
  return new Promise(res => {
    const timer = setTimeout(() => { B.pending.delete(id); res(null); }, 30000);
    B.pending.set(id, blob => {
      clearTimeout(timer);
      if (blob) { B.files.set(id, blob); while (B.files.size > 4) B.files.delete(B.files.keys().next().value); }
      res(blob);
    });
    send('command', { cmd: 'file', id });
  });
}

function initBeamer() {
  document.body.classList.add('beamer');
  document.title = 'MMBbS Teaching Assistant Beamer';
  $('#app').innerHTML = beamerHTML();
  peerWin = window.opener || null;
  Object.assign(B, { pending: new Map(), files: new Map(), qKey: '', qDraw: '' });
  B.viewer = new Viewer($('#bmMedia'), { getBlob: requestFile, onInfo: info => send('command', { cmd: 'info', id: B.viewer.d && B.viewer.d.id, ...info }) });
  Object.assign(B, { bKey: '', seen: new Set(), seenReady: false, seenBoard: '', voteLock: null });
  $('#bmBoard').addEventListener('click', onBoardClick);
  listen((msg, source) => {
    if (source && !peerWin) peerWin = source;
    if (msg.type === 'state') applyState(msg.state);
    else if (msg.type === 'event') handleEvent(msg.name, msg.data || {});
  });
  send('hello');
  setInterval(() => send('ping'), 2000);
  setInterval(beamerTick, 200);
  beamerTick();

  $$('.bm-ctl').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.cmd === 'fullscreen') toggleFullscreen();
    else send('command', { cmd: btn.dataset.cmd });
  }));
  let idleTimer = 0;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  };
  document.addEventListener('mousemove', wake);
  wake();
  document.addEventListener('keydown', e => {
    if (!$('#bmInput').hidden) { if (e.key === 'Escape') closeInput(); return; }
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'Escape') { if ($('#bmOverlay').classList.contains('show')) hideOverlay(); else send('command', { cmd: 'unfocus' }); }
    else if (e.key === 'q' || e.key === 'Q') send('command', { cmd: 'question' });
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); send('command', { cmd: 'page', d: 1 }); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); send('command', { cmd: 'page', d: -1 }); }
    else if (e.key === ' ') { e.preventDefault(); send('command', { cmd: 'timer' }); }
    else if (e.key === 'z' || e.key === 'Z') send('command', { cmd: 'pick' });
  });
}

if (HOSTED) initHostedHint(); else if (IS_BEAMER) initBeamer(); else initDashboard();
</script>
