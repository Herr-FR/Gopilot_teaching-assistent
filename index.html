  if (tgt === cur) { n.cand = null; return; }

  if (n.cand !== next) { n.cand = next; n.candSince = now; return; }
  const hold = tgt > cur ? (next === 'red' ? s.toleranceSec : .8) : 1.5;

      r.bestStreakSec = rt.streakSec;

}
function finishCalibration() {

  s.yellow = clamp(Math.round(median + 14), 10, 90);
  s.red = clamp(Math.round(median + 28), s.yellow + 5, 98);
  rt.calib = null;
  commit();
  toast(`Grundpegel ${Math.round(median)}. Gelb ab ${s.yellow}, Rot ab ${s.red}.`);
}

function engineTick() {
  const now = performance.now();
  const gap = rt.lastTick ? now - rt.lastTick : 0;
  const dt = Math.min(5, gap / 1000);
  rt.lastTick = now;
  timerCheck();
  const n = rt.noise, s = store.settings.noise;
  if (n.source === 'mic' && rt.mic) {
    const g = rt.diag;
    if (gap > g.maxGap) g.maxGap = gap;
    if (gap > 1500) diagLog(`Messpause ${fmtNum(Math.round(gap / 100) / 10)} Sek.`);
    const ctx = rt.mic.ctx;
    g.ctxStill = ctx.currentTime === g.ctxTime ? g.ctxStill + 1 : 0;
    g.ctxTime = ctx.currentTime;
    // Hält der Browser die Verarbeitung an (z. B. verdecktes Fenster), sofort wieder starten
    if (ctx.state !== 'running' && now - rt.mic.lastResume > 2000) {
      rt.mic.lastResume = now;
      ctx.resume().catch(() => {});
    }
    const raw = readMicLevel(now);
    n.level += (raw - n.level) * (dt ? 1 - Math.exp(-dt / .5) : 1);
    if (rt.calib) {
      rt.calib.samples.push(raw);
      if (now - rt.calib.start > 5000) finishCalibration();
    }
    stepLight(n.level >= s.red ? 'red' : n.level >= s.yellow ? 'yellow' : 'green', now);
  }
  if (n.source !== 'off') accrue(dt);
  updateLive();
  if (now - rt.lastPush >= (n.source === 'mic' ? 100 : 500)) pushState();
  if (rt.dirty && now - rt.lastSave > 5000) saveNow();
}

/* ---------- CSV-Import ---------- */
const HEADER_PATTERNS = [
  ['first', /^(vorname|vornamen|rufname|first ?name|given ?name)/],
  ['last', /^(nachname|familienname|zuname|last ?name|surname|family ?name)/],
  ['class', /^(klasse|klassen|kurs|lerngruppe|gruppe|class)/],
  ['full', /^(name|schüler|schueler|sus|student|kind)/],
];
const ROLE_OPTIONS = [['first', 'Vorname'], ['last', 'Nachname'], ['full', 'Ganzer Name'], ['class', 'Klasse'], ['ignore', 'Ignorieren']];

function decodeBytes(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }   // ältere Excel-Exporte
}
function parseCSV(text, delim) {
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false;
      } else field += ch;
    } else if (ch === '"' && field.trim() === '') { quoted = true; field = ''; }
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (ch !== '\r') field += ch;
  }
  row.push(field); rows.push(row);
  return rows.map(r => r.map(f => f.trim())).filter(r => r.some(f => f !== ''));
}
function detectDelimiter(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 25);
  // "Nachname, Vorname" pro Zeile ist ein einzelnes Namensfeld, kein Komma-CSV
  if (lines.length && lines.every(l => /^[^,;\t|]+, [^,;\t|]+$/.test(l.trim()))) return '\u0000';
  let best = '\u0000', bestScore = 0;
  for (const d of [';', '\t', ',', '|']) {
    const rows = parseCSV(lines.join('\n'), d);
    if (!rows.length) continue;
    const freq = {};
    rows.forEach(r => { freq[r.length] = (freq[r.length] || 0) + 1; });
    const [mode, hits] = Object.entries(freq).sort((a, b) => b[1] - a[1])[0];
    if (+mode < 2) continue;
    const score = hits / rows.length + (d === ';' ? .01 : 0);
    if (score > bestScore) { best = d; bestScore = score; }
  }
  return best;
}
function detectHeader(row) {
  const map = row.map(cell => {
    const v = cell.toLowerCase().trim();
    const hit = HEADER_PATTERNS.find(([, re]) => re.test(v));
    return hit ? hit[0] : null;
  });
  if (!map.some(r => r === 'first' || r === 'last' || r === 'full')) return null;
  // "Name;Vorname" meint in Schullisten fast immer den Nachnamen
  if (map.includes('first') && !map.includes('last') && map.includes('full')) map[map.indexOf('full')] = 'last';
  return map.map(r => r || 'ignore');
}
function guessMap(rows, width) {
  if (width === 1) return ['full'];
  const map = Array(width).fill('ignore');
  const classLike = v => /^(\d{1,2}\s?[a-zA-Z]{0,3}|[a-zA-Z]{1,2}\s?\d{1,2}|EF)$/.test(v.trim());
  let classCol = -1;
  for (let i = 0; i < width && classCol < 0; i++) {
    const vals = rows.slice(0, 20).map(r => r[i] || '').filter(Boolean);
    if (vals.length && vals.every(classLike)) classCol = i;
  }
  if (classCol >= 0) map[classCol] = 'class';
  const nameCols = [...Array(width).keys()].filter(i => i !== classCol);
  if (nameCols.length === 1) map[nameCols[0]] = 'full';
  else { map[nameCols[0]] = 'first'; map[nameCols[1]] = 'last'; }
  return map;
}
function splitFull(full) {
  if (full.includes(',')) {
    const [last, ...first] = full.split(',');
    return { first: first.join(',').trim(), last: last.trim() };
  }
  const parts = full.trim().split(/\s+/);
  if (parts.length === 1) return { first: parts[0], last: '' };
  return { first: parts.slice(0, -1).join(' '), last: parts[parts.length - 1] };
}
function rowToStudent(r, map) {
  let first = '', last = '', full = '', cls = '';
  map.forEach((role, i) => {
    const v = (r[i] || '').trim();
    if (!v) return;
    if (role === 'first') first = first ? `${first} ${v}` : v;
    else if (role === 'last') last = last ? `${last} ${v}` : v;
    else if (role === 'full') full = v;
    else if (role === 'class') cls = v;
  });
  if (full && !first && !last) ({ first, last } = splitFull(full));
  return { first, last, cls };
}
function importText(text, fileName = '') {
  text = text.replace(/^﻿/, '');
  const delim = detectDelimiter(text);
  let rows = parseCSV(text, delim);
  if (!rows.length) { toast('In der Datei wurden keine Namen gefunden.'); return; }
  const width = Math.max(...rows.map(r => r.length));
  rows = rows.map(r => r.concat(Array(width - r.length).fill('')));
  const headerMap = detectHeader(rows[0]);
  const map = headerMap || guessMap(rows, width);
  const fromName = (fileName.match(/(?:^|[^a-z0-9])(\d{1,2}\s?[a-z]{1,2}|q[12]|ef)(?:[^a-z0-9]|$)/i) || [])[1] || '';
  rt.imp = {
    fileName, rows, map, hasHeader: !!headerMap,
    target: map.includes('class') ? 'column' : (activeClass() ? 'existing' : 'new'),
    classId: store.activeClassId,
    newName: fromName,
  };
  renderAll();
  const box = $('.imp');
  if (box) box.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'start' });
}
async function readImportFile(file) {
  if (/\.(xlsx?|ods|numbers)$/i.test(file.name)) {
    toast('Bitte speichere die Liste zuerst als CSV (in Excel: Speichern unter > CSV UTF-8).');
    return;
  }
  try { importText(decodeBytes(await file.arrayBuffer()), file.name); }
  catch (e) { toast('Die Datei konnte nicht gelesen werden.'); }
}
function importRecords() {
  const imp = rt.imp;
  return (imp.hasHeader ? imp.rows.slice(1) : imp.rows).map(r => rowToStudent(r, imp.map)).filter(x => x.first || x.last);
}
function findOrCreateClass(name) {
  let c = store.classes.find(k => k.name.toLowerCase() === name.toLowerCase());
  if (!c) { c = newClass(name); store.classes.push(c); }
  return c;
}
function runImport() {

  let added = 0, skipped = 0;
  const touched = new Set();
  for (const rec of recs) {

    if (imp.target === 'column') c = findOrCreateClass(rec.cls || 'Ohne Klasse');
    else if (imp.target === 'existing') c = store.classes.find(k => k.id === imp.classId);
    else c = findOrCreateClass(imp.newName.trim() || 'Neue Klasse');
    if (!c) continue;
    const key = `${rec.first} ${rec.last}`.trim().toLowerCase();
    if (c.students.some(s => `${s.first} ${s.last}`.trim().toLowerCase() === key)) { skipped++; continue; }
    c.students.push({ id: uid(), first: rec.first, last: rec.last });
    touched.add(c);
    added++;
  }
  touched.forEach(c => c.students.sort(byLast));

  rt.imp = null;
  commit();

  toast(`${added} SuS importiert${where}${skipped ? `, ${skipped} doppelte übersprungen` : ''}.`);
}
function sampleCSV() {

/* ---------- Vokabeln mit Wörterbuch ---------- */
const VOCAB_LANGS = { en: 'Englisch', fr: 'Französisch', es: 'Spanisch', it: 'Italienisch', la: 'Latein', nl: 'Niederländisch', pl: 'Polnisch', ru: 'Russisch', tr: 'Türkisch', pt: 'Portugiesisch' };
const langName = code => VOCAB_LANGS[code] || code;
const dictUrl = (lang, word) => `https://${lang === 'en' ? 'www' : 'de' + lang}.dict.cc/?s=${encodeURIComponent(word)}`;

// MyMemory liefert neben der Hauptübersetzung weitere Treffer. Bevorzugt werden
// Treffer, die so viele Wörter haben wie die Eingabe und mehrfach vorkommen.
function rankTranslations(source, data, target) {
  const src = source.trim().toLowerCase(), srcWords = src.split(/\s+/).length;
  const pool = new Map();
  const add = (text, quality, isMain) => {
    let t = String(text || '').trim().replace(/[.!?;:,]+$/, '');
    if (!t || t.length > 48 || /[()[\]]|MYMEMORY|https?:/i.test(t)) return;
    if (target !== 'de' && t !== t.toUpperCase()) t = t.charAt(0).toLowerCase() + t.slice(1);
    const key = t.toLowerCase();
    if (key === src) return;
    const e = pool.get(key) || { text: t, base: 0, n: 0 };
    e.n++;
    e.base = Math.max(e.base, (+quality || 0) * .3 + (isMain ? 10 : 0));
    pool.set(key, e);
  };
  add(data.responseData && data.responseData.translatedText, 0, true);
  (data.matches || []).forEach(m => add(m.translation, m.quality, false));
  return [...pool.values()]
    .map(e => ({ text: e.text, score: e.base + e.n * 8 - Math.abs(e.text.split(/\s+/).length - srcWords) * 30 }))
    .sort((a, b) => b.score - a.score)
    .map(e => e.text);
}
async function lookupTranslation(text, from, to) {
  const email = store.settings.vocabEmail.trim();
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}%7C${to}${email ? '&de=' + encodeURIComponent(email) : ''}`;
  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), 7000);
  try {
    const data = await (await fetch(url, { signal: ctrl.signal })).json();
    if (+data.responseStatus !== 200) throw new Error(String(data.responseDetails || data.responseStatus));
    return rankTranslations(text, data, to);
  } finally {
    clearTimeout(timeout);
  }
}

/* ---------- Dateiablage im Browser (IndexedDB) ---------- */
const FileStore = {
  mem: new Map(), p: null,
  open() {
    if (!this.p) this.p = new Promise(res => {
      try {
        const r = indexedDB.open('mmbbs-teaching-assistant-files', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return this.p;
  },
  async tx(mode, fn) {
    const db = await this.open();
    if (!db) return null;
    return new Promise(res => {
      try {
        const t = db.transaction('files', mode), req = fn(t.objectStore('files'));
        t.oncomplete = () => res(req ? req.result : true);
        t.onerror = t.onabort = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async put(id, blob) { const ok = await this.tx('readwrite', s => s.put(blob, id)); if (!ok) this.mem.set(id, blob); return !!ok; },
  async get(id) { return this.mem.get(id) || (await this.tx('readonly', s => s.get(id))) || null; },
  async del(id) { this.mem.delete(id); await this.tx('readwrite', s => s.delete(id)); },
};

const CAT_NAMES = { pdf: 'PDF', image: 'Bild', video: 'Video', audio: 'Audio', docx: 'Word', text: 'Text', html: 'HTML-Seite', web: 'Webseite', screen: 'Geteiltes Fenster', note: 'Text' };
const catIcon = cat => ({ note: 'note', web: 'globe', image: 'media', video: 'play', audio: 'play', screen: 'share' }[cat] || 'file');
function fileCat(name, mime = '') {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (mime === 'application/pdf' || ext === 'pdf') return 'pdf';
  if (/^image\//.test(mime) || /^(png|jpe?g|gif|webp|svg|bmp|avif)$/.test(ext)) return 'image';
  if (/^video\//.test(mime) || /^(mp4|webm|mov|m4v|ogv)$/.test(ext)) return 'video';
  if (/^audio\//.test(mime) || /^(mp3|wav|ogg|oga|m4a|aac|flac)$/.test(ext)) return 'audio';
  if (ext === 'docx') return 'docx';
  if (/^(html?)$/.test(ext)) return 'html';
  if (/^(txt|md|csv|json|log)$/.test(ext) || mime === 'text/plain') return 'text';
  return 'other';
}
function fmtSize(n) {
  return n < 1048576 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${fmtNum(Math.round(n / 104857.6) / 10)} MB`;
}
function normalizeUrl(raw) {
  raw = String(raw || '').trim();
  if (!raw) return null;
  try {
    const u = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : 'https://' + raw);
    return /^https?:$/.test(u.protocol) && u.hostname.includes('.') ? u.href : null;
  } catch (e) { return null; }
}
const hostOf = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; } };
// Bekannte Dienste in ihre Einbettungs-Adresse umschreiben
function embedUrl(url) {
  let u;
  try { u = new URL(url); } catch (e) { return url; }
  const h = u.hostname.replace(/^(www|m)\./, '');
  const yt = id => `https://www.youtube-nocookie.com/embed/${id}?rel=0${u.searchParams.get('t') ? '&start=' + parseInt(u.searchParams.get('t'), 10) : ''}`;
  if (h === 'youtube.com' && u.searchParams.get('v')) return yt(u.searchParams.get('v'));
  if (h === 'youtube.com' && /^\/(shorts|live)\/([\w-]+)/.test(u.pathname)) return yt(u.pathname.split('/')[2]);
  if (h === 'youtu.be') return yt(u.pathname.slice(1));
  if (h === 'vimeo.com' && /^\/\d+/.test(u.pathname)) return `https://player.vimeo.com/video/${u.pathname.split('/')[1]}`;
  const g = u.pathname.match(/^\/(document|presentation|spreadsheets)\/d\/([\w-]+)/);
  if (h === 'docs.google.com' && g) return `https://docs.google.com/${g[1]}/d/${g[2]}/${g[1] === 'presentation' ? 'embed?start=false' : 'preview'}`;
  const dr = u.pathname.match(/^\/file\/d\/([\w-]+)/);
  if (h === 'drive.google.com' && dr) return `https://drive.google.com/file/d/${dr[1]}/preview`;
  return url;
}

/* ---------- Anzeige-Programme, nur bei Bedarf aus dem Netz ---------- */
const LIBS = {
  pdf: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  pdfWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  docx: 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',
};
const libCache = {};
function loadScript(src) {
  if (!libCache[src]) libCache[src] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = res;
    s.onerror = () => { delete libCache[src]; s.remove(); rej(new Error('offline')); };
    document.head.appendChild(s);
  });
  return libCache[src];
}
let pdfjsReady = null;
function getPdfjs() {
  if (!pdfjsReady) pdfjsReady = (async () => {
    await loadScript(LIBS.pdf);
    const lib = window.pdfjsLib;
    if (!lib) throw new Error('pdf.js fehlt');
    // Der Worker kommt von einem anderen Server, daher als lokale Kopie starten
    try {
      const code = await (await fetch(LIBS.pdfWorker)).text();
      lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    } catch (e) { lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker; }
    return lib;
  })().catch(e => { pdfjsReady = null; throw e; });
  return pdfjsReady;
}

/* ---------- Viewer: zeigt eine Datei, Webseite oder ein geteiltes Fenster ----------
   Wird im Beamer und als kleine Vorschau im Dashboard benutzt. */
class Viewer {
  constructor(host, { preview = false, onInfo = null, getBlob }) {
    Object.assign(this, { host, preview, onInfo, getBlob, key: '', d: null, token: 0, pdfTok: 0, url: '', pdf: null, stream: null });
    this.ro = new ResizeObserver(() => { clearTimeout(this.rz); this.rz = setTimeout(() => this.layout(), 140); });
    this.ro.observe(host);
  }
  clear() {
    this.token++;
    this.key = '';
    this.d = null;
    if (this.url) { URL.revokeObjectURL(this.url); this.url = ''; }
    if (this.pdf) { try { this.pdf.destroy(); } catch (e) { /* egal */ } this.pdf = null; }
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    this.host.innerHTML = '';
    this.host.dataset.cat = '';
  }
  async show(d) {
    if (!d) { if (this.key) this.clear(); return; }
    if (d.key !== this.key) { this.clear(); this.key = d.key; this.d = d; await this.build(this.token); }
    else { const old = this.d; this.d = d; this.apply(old); }
  }
  msg(html) { this.host.innerHTML = `<div class="mv-msg">${html}</div>`; }
  async build(tok) {
    const d = this.d, h = this.host, name = esc(d.name);
    h.dataset.cat = d.cat;
    if (d.cat === 'web') {
      if (this.preview) { this.msg(`${icon('globe')}<strong>${name}</strong><span>${esc(hostOf(d.url))}</span>`); return; }
      h.innerHTML = `<div class="mv-scale"><iframe class="mv-frame" src="${esc(d.embed)}" title="${name}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
      this.apply(null);
      return;
    }
    if (d.cat === 'screen') { this.buildScreen(tok); return; }
    if (this.preview && /^(video|audio|docx|html)$/.test(d.cat)) {
      this.msg(`${icon(catIcon(d.cat))}<strong>${name}</strong><span>${CAT_NAMES[d.cat]}, läuft am Beamer</span>`);
      return;
    }
    if (d.cat === 'note') {
      h.innerHTML = '<div class="mv-scroll"><article class="mv-note"><h2 class="mv-note-title"></h2><div class="mv-note-text"></div></article></div>';
      this.apply(null);
      return;
    }
    this.msg('<span class="mv-spin" aria-hidden="true"></span><span>Lade …</span>');
    const blob = await this.getBlob(d.id);
    if (tok !== this.token) return;
    if (!blob) { this.msg(`${icon('file')}<strong>${name}</strong><span>Die Datei konnte nicht geladen werden. Lade sie unter Medien erneut hoch.</span>`); return; }
    this.url = URL.createObjectURL(blob);
    if (d.cat === 'image') {
      h.innerHTML = `<div class="mv-pan"><img class="mv-img" alt="${name}" src="${this.url}"></div>`;
    } else if (d.cat === 'video') {
      h.innerHTML = `<video class="mv-video" src="${this.url}" controls playsinline></video>`;
      this.lastPaused = undefined;
    } else if (d.cat === 'audio') {
      h.innerHTML = `<div class="mv-msg">${icon('play')}<strong>${name}</strong><audio class="mv-video mv-audio" src="${this.url}" controls></audio></div>`;
      this.lastPaused = undefined;
    } else if (d.cat === 'html') {
      h.innerHTML = `<div class="mv-scale"><iframe class="mv-frame" sandbox="allow-scripts allow-forms allow-popups allow-modals" src="${this.url}" title="${name}"></iframe></div>`;
    } else if (d.cat === 'text') {
      const text = await blob.text();
      if (tok !== this.token) return;
      h.innerHTML = '<div class="mv-scroll"><pre class="mv-doc mv-text"></pre></div>';
      h.querySelector('pre').textContent = text;
    } else if (d.cat === 'docx') {
      try {
        await loadScript(LIBS.docx);
        const res = await window.mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() });
        if (tok !== this.token) return;
        h.innerHTML = `<div class="mv-scroll"><article class="mv-doc">${res.value}</article></div>`;
        h.querySelectorAll('.mv-doc script, .mv-doc iframe').forEach(n => n.remove());
      } catch (e) {
        this.msg(`${icon('file')}<strong>${name}</strong><span>Word-Dateien brauchen beim Öffnen eine Internetverbindung. Ohne Internet speicherst du die Datei vorher als PDF.</span>`);
        return;
      }
    } else if (d.cat === 'pdf') {
      try {
        const lib = await getPdfjs();
        const doc = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
        if (tok !== this.token) { doc.destroy(); return; }
        this.pdf = doc;
        h.innerHTML = '<div class="mv-scroll mv-pdf"><canvas class="mv-canvas"></canvas></div>';
        if (this.onInfo) this.onInfo({ pages: doc.numPages, native: false });
      } catch (e) {
        if (tok !== this.token) return;
        // Ohne Internet: eingebauter PDF-Viewer des Browsers
        h.innerHTML = `<iframe class="mv-frame mv-native" src="${this.url}#view=FitH" title="${name}"></iframe>`;
        if (this.onInfo) this.onInfo({ pages: 0, native: true });
        return;
      }
    }
    this.apply(null);
  }
  buildScreen(tok) {
    const h = this.host;
    if (this.preview) { this.msg(`${icon('share')}<strong>Fenster oder Tab teilen</strong><span>Die Auswahl triffst du im Beamer-Fenster.</span>`); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { this.msg(`${icon('share')}<strong>Teilen nicht möglich</strong><span>Dieser Browser kann keine Fenster teilen. Nutze Chrome.</span>`); return; }
    const ask = (note = '') => {
      h.innerHTML = `<div class="mv-msg">${icon('share')}<strong>Fenster oder Tab zeigen</strong><span>${note ? esc(note) + ' ' : ''}Klicke auf den Knopf und wähle aus, was am Beamer erscheinen soll.</span><button type="button" class="mv-share-btn">Fenster auswählen</button></div>`;
      h.querySelector('button').addEventListener('click', start);
    };
    const start = async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        if (tok !== this.token) { stream.getTracks().forEach(t => t.stop()); return; }
        this.stream = stream;
        h.innerHTML = '<video class="mv-video mv-live" autoplay muted playsinline></video>';
        const v = h.querySelector('video');
        v.srcObject = stream;
        v.play().catch(() => {});
        stream.getVideoTracks()[0].addEventListener('ended', () => { if (tok === this.token) { this.stream = null; ask('Das Teilen wurde beendet.'); } });
      } catch (e) { if (tok === this.token) ask(e.name === 'NotAllowedError' ? 'Die Auswahl wurde abgebrochen.' : 'Das Teilen hat nicht geklappt.'); }
    };
    ask();
  }
  apply(old) {
    const d = this.d, h = this.host;
    if (!d) return;
    const z = typeof d.zoom === 'number' ? d.zoom : 1;
    if (d.cat === 'web' || d.cat === 'html') {
      const s = h.querySelector('.mv-scale');
      if (s) s.style.setProperty('--z', z);
    } else if (d.cat === 'image') {
      const img = h.querySelector('.mv-img');
      if (img) img.style.transform = `scale(${z})`;
    } else if (d.cat === 'video' || d.cat === 'audio') {
      const v = h.querySelector('.mv-video');
      if (!v) return;
      if (old && d.restart !== old.restart) v.currentTime = 0;
      if (d.paused !== this.lastPaused || (old && d.restart !== old.restart)) {
        this.lastPaused = d.paused;
        if (d.paused) v.pause();
        else v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
      }
    } else if (d.cat === 'note') {
      const art = h.querySelector('.mv-note');
      if (!art) return;
      const t = art.querySelector('.mv-note-title'), body = art.querySelector('.mv-note-text'), text = d.text || '', len = text.length;
      if (t.textContent !== (d.title || '')) t.textContent = d.title || '';
      t.hidden = !d.title;
      if (body.textContent !== text) body.textContent = text;
      art.style.setProperty('--n', len < 60 ? 9 : len < 160 ? 6.6 : len < 400 ? 4.8 : len < 900 ? 3.8 : 3.1);
      art.style.setProperty('--z', z);
      this.scrollTo();
    } else if (d.cat === 'text' || d.cat === 'docx') {
      const doc = h.querySelector('.mv-doc');
      if (doc) doc.style.fontSize = `calc(var(--doc-size) * ${z})`;
      this.scrollTo();
    } else if (d.cat === 'pdf' && this.pdf) {
      if (!old || old.page !== d.page || old.zoom !== d.zoom) this.renderPdf();
      else this.scrollTo();
    }
  }
  layout() {
    if (this.d && this.d.cat === 'pdf' && this.pdf) this.renderPdf();
  }
  scrollTo() {
    const sc = this.host.querySelector('.mv-scroll');
    if (sc) sc.scrollTo({ top: (this.d.scroll || 0) * sc.clientHeight * .8, behavior: REDUCED_MOTION ? 'auto' : 'smooth' });
  }
  async renderPdf() {
    const d = this.d, doc = this.pdf, sc = this.host.querySelector('.mv-scroll'), cv = this.host.querySelector('.mv-canvas');
    if (!doc || !cv || !sc) return;
    const tok = ++this.pdfTok;
    const page = await doc.getPage(clamp(d.page || 1, 1, doc.numPages));
    if (tok !== this.pdfTok) return;
    const W = sc.clientWidth, H = sc.clientHeight;
    if (!W || !H) return;
    const base = page.getViewport({ scale: 1 });
    const fit = d.zoom === 'width' ? (W - 2) / base.width : Math.min(W / base.width, H / base.height);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const vp = page.getViewport({ scale: fit * dpr });
    // Erst unsichtbar zeichnen, dann tauschen: kein Flackern beim Blättern
    const off = document.createElement('canvas');
    off.width = Math.floor(vp.width);
    off.height = Math.floor(vp.height);
    try { await page.render({ canvasContext: off.getContext('2d'), viewport: vp }).promise; } catch (e) { return; }
    if (tok !== this.pdfTok) return;
    cv.width = off.width;
    cv.height = off.height;
    cv.style.width = Math.floor(vp.width / dpr) + 'px';
    cv.style.height = Math.floor(vp.height / dpr) + 'px';
    cv.getContext('2d').drawImage(off, 0, 0);
    sc.classList.toggle('fitw', d.zoom === 'width');
    this.scrollTo();
  }
}

/* ---------- Medien und Bühne (Dashboard) ---------- */
async function addFiles(files) {
  let added = 0;
  for (const f of files) {
    const cat = fileCat(f.name, f.type);
    if (cat === 'other') {
      toast(/\.(pptx?|key|odp)$/i.test(f.name) ? `${f.name}: Speichere die Präsentation als PDF und lade das PDF hoch.`
        : /\.(xlsx?|ods|numbers)$/i.test(f.name) ? `${f.name}: Speichere die Tabelle als PDF und lade das PDF hoch.`
        : `${f.name}: Dieses Format kann der Beamer nicht zeigen. Speichere die Datei als PDF.`);
      continue;
    }
    if (f.size > 500 * 1048576) { toast(`${f.name} ist größer als 500 MB.`); continue; }
    const item = { id: uid(), kind: 'file', cat, name: f.name, mime: f.type, size: f.size, t: Date.now() };
    if (!(await FileStore.put(item.id, f))) item.temp = true;
    store.media.unshift(item);
    added++;
  }
  if (!added) return;
  commit();
  const temp = store.media.slice(0, added).some(m => m.temp);
  toast(`${added} ${added === 1 ? 'Datei' : 'Dateien'} gespeichert${temp ? ', aber nur bis zum Schließen, weil der Browser keinen Speicher erlaubt' : ''}. Mit „Zeigen“ erscheint sie am Beamer.`);
}
function addWeb(raw, title = '') {
  const url = normalizeUrl(raw);
  if (!url) { toast('Das sieht nicht wie eine Webadresse aus.'); return null; }
  let item = store.media.find(m => m.kind === 'web' && m.url === url);
  if (!item) {
    item = { id: uid(), kind: 'web', cat: 'web', name: title.trim() || hostOf(url) + (new URL(url).pathname.length > 1 ? ' · ' + decodeURIComponent(new URL(url).pathname).slice(1, 40) : ''), url, t: Date.now() };
    store.media.unshift(item);
  } else if (title.trim()) item.name = title.trim();
  return item;
}
function showMedia(id) {
  const m = store.media.find(x => x.id === id);
  if (!m) return;
  m.used = Date.now();
  store.stage = { kind: 'media', id, page: 1, pages: 0, zoom: m.cat === 'pdf' ? 'page' : 1, scroll: 0, paused: false, restart: 0, reload: 0 };
  send('event', { name: 'hide' });
  commit();
}
function showScreenShare() {
  store.stage = { kind: 'screen', rev: Date.now() };
  send('event', { name: 'hide' });
  commit();
  toast('Klicke am Beamer auf „Fenster auswählen“ und wähle den Tab oder das Fenster.');
}
function deleteMedia(id) {
  const m = store.media.find(x => x.id === id);
  if (!m) return;
  store.media = store.media.filter(x => x.id !== id);
  if (store.stage && store.stage.id === id) { store.stage = null; if (store.focus === 'stage') store.focus = null; }
  if (m.kind === 'file') FileStore.del(id);
  commit();
  toast(`${m.name} wurde entfernt.`);
}
function stageClear() {
  store.stage = null;
  if (store.focus === 'stage') store.focus = null;
  commit();
}
function stageSet(patch) {
  if (!store.stage) return;
  Object.assign(store.stage, patch);
  commit();
}

function stagePage(dir) {

  if (s.kind === 'board' || s.kind === 'market') {
    const obj = s.kind === 'market' ? store.market : boardOf(s.board);
    if (!obj) return false;
    const views = s.kind === 'market' ? ['all', ...obj.rounds.map(r => r.id)] : boardViews(obj);
    const i = Math.max(0, views.indexOf(obj.view)), j = clamp(i + dir, 0, views.length - 1);
    if (j !== i) { obj.view = views[j]; commit(); }
    return true;
  }
  const m = s.kind === 'media' && store.media.find(x => x.id === s.id);
  if (!m) return false;
  if (m.cat === 'pdf' && !s.native) {
    const p = clamp(s.page + dir, 1, s.pages || s.page + Math.max(dir, 0));
    if (p !== s.page) stageSet({ page: p, scroll: 0 });

  }
  if (m.cat === 'docx' || m.cat === 'text' || m.cat === 'note') { stageSet({ scroll: Math.max(0, (s.scroll || 0) + dir) }); return true; }

const activeBox = () => store.qboxes.find(b => b.id === store.activeBoxId) || null;
const newBox = name => ({ id: uid(), name: name.trim() || 'Neue Fragenbox', items: [], noRepeat: true, drawn: [] });
function parseQuestions(text) {
  text = String(text || '').replace(/^﻿/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const head = /^"?(frage|fragen|question)"?\s*([;,])/i.exec(lines[0].trim());
  const rows = head
    ? parseCSV(text, head[2]).slice(1).map(r => [r[0] || '', r.slice(1).filter(Boolean).join(' ')])
    : lines.map(l => {
      const i = l.indexOf('\t') >= 0 ? l.indexOf('\t') : l.indexOf('|');
      return i >= 0 ? [l.slice(0, i), l.slice(i + 1)] : [l, ''];
    });
  const clean = s => String(s || '').trim().replace(/^"(.*)"$/s, '$1').replace(/\t+/g, ' ').trim();
  return rows
    .map(([q, a]) => ({ q: clean(q).replace(/^(?:\d{1,3}[.)]|[-*•–])\s+/, '').trim(), a: clean(a) }))
    .filter(x => x.q && !/^(frage|fragen|question)$/i.test(x.q));
}
function addQuestions(b, text) {
  const known = new Set(b.items.map(q => q.q.toLowerCase()));
  let n = 0;
  for (const { q, a } of parseQuestions(text)) {
    if (known.has(q.toLowerCase())) continue;
    known.add(q.toLowerCase());
    b.items.push({ id: uid(), q, a });
    n++;
  }
  return n;
}
async function importQuestionsFile(file) {
  if (/\.(xlsx?|ods|numbers|docx?)$/i.test(file.name)) { toast('Bitte speichere die Fragen als CSV oder TXT (in Excel: Speichern unter > CSV UTF-8).'); return; }
  let text;
  try { text = decodeBytes(await file.arrayBuffer()); } catch (e) { toast('Die Datei konnte nicht gelesen werden.'); return; }
  let b = activeBox();
  if (!b) { b = newBox(file.name.replace(/\.[^.]+$/, '')); store.qboxes.push(b); store.activeBoxId = b.id; }
  const n = addQuestions(b, text);
  commit();
  toast(n ? `${n} ${n === 1 ? 'Frage' : 'Fragen'} in ${b.name} importiert.` : 'In der Datei wurden keine neuen Fragen gefunden.');
}

  const k = mkKey(name), has = x => x.people.some(p => mkKey(p.name) === k) || x.wait.some(p => mkKey(p.name) === k);
  if (has(s)) { notify(`${name} ist bei „${s.title}“ schon eingetragen.`, remote); return; }
  let moved = '';
  if (m.one) {
    m.sessions.filter(x => x.roundId === s.roundId && x.id !== s.id && has(x)).forEach(x => {
      x.people = x.people.filter(p => mkKey(p.name) !== k);
      x.wait = x.wait.filter(p => mkKey(p.name) !== k);
      mkPromote(x);
      moved = x.title;
    });
  }
  const full = s.people.length >= s.cap;
  (full ? s.wait : s.people).push({ id: uid(), name });
  notify(full ? `${name} steht auf der Warteliste für „${s.title}“.` : `${name} ist für „${s.title}“ angemeldet.${moved ? ` Die Anmeldung für „${moved}“ ist dafür entfallen.` : ''}`, remote);
  if (remote) softRender(); else commit();
}

/* ---------- QR-Codes (Programm von jsDelivr, nur bei Bedarf) ---------- */
const QR_LIB = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
const qrCache = new Map();
async function qrSvg(text) {
  if (qrCache.has(text)) return qrCache.get(text);
  await loadScript(QR_LIB);
  const lib = window.qrcode;
  if (lib.stringToBytesFuncs && lib.stringToBytesFuncs['UTF-8']) lib.stringToBytes = lib.stringToBytesFuncs['UTF-8'];
  const q = lib(0, 'M');
  q.addData(text);
  q.make();
  const svg = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  qrCache.set(text, svg);
  return svg;
}
function fillQr(root) {
  $$('[data-qr]', root).forEach(async el => {
    const t = el.dataset.qr;
    if (!t || el.dataset.qrDone === t) return;
    try {
      const svg = await qrSvg(t);
      if (el.dataset.qr === t) { el.innerHTML = svg; el.dataset.qrDone = t; el.classList.remove('off'); }
    } catch (e) {
      el.classList.add('off');
      el.innerHTML = `<span>QR-Code braucht Internet<br>${esc(hostOf(t))}</span>`;
    }
  });
}

function renderBoard(sd) {
  const lock = B.voteLock && B.voteLock.until > Date.now() ? B.voteLock.sec : '';
  const key = JSON.stringify(sd) + '|' + lock;
  if (key === B.bKey) return;
  const id = sd.kind === 'market' ? 'market' : sd.board;
  if (B.seenBoard !== id) { B.seen = new Set(); B.seenReady = false; B.seenBoard = id; }
  B.bKey = key;
  const box = $('#bmBoard'), top = box.scrollTop;
  box.innerHTML = sd.kind === 'market' ? marketHTML(sd.m) : boardHTML(sd);
  box.scrollTop = top;
  if (sd.kind === 'board') sd.sections.forEach(x => (x.cards || []).forEach(k => B.seen.add(k.id)));
  B.seenReady = true;
  fillQr(box);
}
function closeInput() {
  const box = $('#bmInput');

function openInput({ title, hint = '', multiline = false, names = [], placeholder = '', submit = 'Senden', onSubmit }) {
  const box = $('#bmInput');
  box.innerHTML = `<form class="bm-input-box"><h3></h3>${hint ? '<p></p>' : ''}
    ${multiline ? '<textarea rows="3" maxlength="240"></textarea>' : '<input type="text" maxlength="60" autocomplete="off" spellcheck="false">'}
    ${names.length ? `<div class="bm-input-names">${names.map(n => `<button type="button" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
    <div class="bm-input-actions"><button type="button" class="bi-cancel">Abbrechen</button><button class="bi-ok"></button></div></form>`;
  box.querySelector('h3').textContent = title;
  if (hint) box.querySelector('p').textContent = hint;
  box.querySelector('.bi-ok').textContent = submit;
  const field = box.querySelector('textarea, input');
  field.placeholder = placeholder;
  const done = v => { closeInput(); onSubmit(v); };
  box.querySelector('form').addEventListener('submit', e => { e.preventDefault(); const v = field.value.trim(); if (v) done(v); else field.focus(); });
  box.querySelector('.bi-cancel').addEventListener('click', closeInput);
  box.querySelectorAll('[data-name]').forEach(b => b.addEventListener('click', () => done(b.dataset.name)));
  box.hidden = false;
  setTimeout(() => field.focus(), 30);
}
function onBoardClick(e) {
  const btn = e.target.closest('[data-bcmd]'), sd = B.st && B.st.stage;
  if (!btn || btn.disabled || !sd) return;
  const cmd = btn.dataset.bcmd;
  if (cmd === 'vote') {
    send('command', { cmd: 'vote', board: sd.board, sec: btn.dataset.sec, v: +btn.dataset.v });
    btn.classList.add('voted');
    // Kurz sperren, damit niemand aus Versehen doppelt tippt
    B.voteLock = { sec: btn.dataset.sec, until: Date.now() + 1500 };
    btn.closest('.bd-sec').querySelectorAll('.bd-vote').forEach(b => { b.disabled = true; });
    setTimeout(() => { B.bKey = ''; if (B.st && B.st.stage && B.st.stage.kind === 'board') renderBoard(B.st.stage); }, 1550);
    bmToast('Danke für deine Stimme!');
  } else if (cmd === 'card') {
    const x = sd.sections.find(s => s.id === btn.dataset.sec);
    if (!x) return;
    openInput({ title: x.q, hint: x.hint, multiline: true, placeholder: 'Schreib hier deine Karte …', submit: 'Karte anheften', onSubmit: text => {
      send('command', { cmd: 'card', board: sd.board, sec: x.id, text });
      bmToast(sd.moderate ? 'Danke! Deine Karte erscheint nach der Freigabe.' : 'Danke! Deine Karte hängt an der Wand.');
    } });
  } else if (cmd === 'signup') {
    const s = sd.m.sessions.find(x => x.id === btn.dataset.sid);
    if (!s) return;
    openInput({ title: `${s.n >= s.cap ? 'Warteliste' : 'Anmelden'}: ${s.title}`, hint: sd.m.names.length ? 'Tippe auf deinen Namen oder schreib ihn auf.' : 'Schreib deinen Namen auf.', names: sd.m.names, placeholder: 'Dein Name', submit: s.n >= s.cap ? 'Auf die Warteliste' : 'Anmelden', onSubmit: name => send('command', { cmd: 'signup', sid: s.id, name }) });
  }
}

          <button class="btn danger" data-action="vocab-clear" ${v.items.length ? '' : 'disabled'}>Liste leeren</button>
        </div>
        <p class="muted small">Die Übersetzung kommt vom kostenlosen Dienst MyMemory. Übertragen wird nur das eingegebene Wort, keine Namen. Ohne Internet trägst du die Übersetzung selbst ein.</p>
        <label class="field"><span>E-Mail für mehr Übersetzungen (optional)</span><input type="text" value="${esc(st.vocabEmail)}" data-change="vocab-email" placeholder="name@schule.de" inputmode="email" autocomplete="email"></label>
        <p class="muted small">Ohne E-Mail sind etwa 5.000 Zeichen am Tag frei, mit E-Mail etwa 50.000. Die Adresse geht nur an MyMemory.</p>
      </div>
    </section>
  </div>`;
}

function pageUnterricht(c) {
  if (!c) return emptyState();
  const absent = c.students.length - presentStudents(c).length;
  const counts = cardCountsMap(c.id, 'today'), today = todayKey();
  const chips = [...c.students].sort(byFirst).map(s => {
    const k = counts[s.id] || {}, abs = s.absentOn === today, name = esc(fullName(s));
    const initials = ((s.first[0] || '') + (s.last[0] || '')).toUpperCase() || '?';
    return `<div class="sus ${abs ? 'absent' : ''}">
      <button class="sus-main" data-action="student" data-id="${s.id}" title="Notiz, Aufrufen, Anwesenheit">
        <span class="sus-avatar" aria-hidden="true">${esc(initials)}</span>
        <span class="sus-name">${esc(s.first || s.last)}</span>
        <span class="sus-last">${abs ? 'heute abwesend' : esc(s.first ? s.last : '')}</span>
      </button>
      ${abs ? '' : `<div class="sus-cards">${['green', 'yellow', 'red'].map(t => `<button class="mini-card ${t}" data-action="quick-card" data-type="${t}" data-id="${s.id}" data-count="${k[t] || 0}" title="${CARD[t].long} für ${name}" aria-label="${CARD[t].long} für ${name}${k[t] ? `, heute schon ${k[t]}` : ''}">${k[t] || ''}</button>`).join('')}</div>`}
    </div>`;
  }).join('');
  return `
  <div class="page-head"><div><h1>Unterricht</h1><p class="lead">${esc(c.name)} mit ${c.students.length} SuS${absent ? `, davon ${absent} heute abwesend` : ''}</p></div></div>
  <div class="grid">
    ${pickPanel(c, 's5')}
    ${timerPanel('s7')}
    <section class="panel s12 as-panel">
      <div class="as-ampel">
        <div class="panel-head"><h2>Ampel</h2><div class="row">${sourceSeg()}${rt.noise.source !== 'off' ? focusBtn('ampel') : ''}</div></div>
        <div class="as-row">${miniAmpel()}<div class="as-meter">${meterHTML()}${micWarnHTML()}<p class="muted small">${noiseHint()}</p></div></div>
      </div>
      <div class="as-stars">
        <div class="panel-head"><h2>Sterne für ${esc(c.name)}</h2><div class="row"><button class="btn ghost" data-action="nav" data-page="sterne">Regeln und Ziel</button>${focusBtn('stars')}</div></div>
        ${starsBlock(c)}
      </div>
    </section>
    <section class="panel s12">
      <div class="panel-head"><h2>SuS</h2><span class="muted small">Karte antippen vergibt Lob, Gelb oder Rot. Auf den Namen tippen für Notizen und Anwesenheit.</span></div>
      ${c.students.length ? `<div class="sus-grid">${chips}</div>` : `<div class="row"><span class="muted">In dieser Klasse sind noch keine SuS.</span><button class="btn" data-action="nav" data-page="klassen">Namen hinzufügen</button></div>`}
    </section>
    ${questionPanel('s5')}
    ${stagePanel('s7')}
    ${vocabPanel(c, 's7')}
    <section class="panel s5">
      <div class="panel-head"><h2>Hinweis am Beamer</h2>${store.message.trim() ? focusBtn('message') : ''}</div>
      <p class="muted small">Steht unter der Uhr, zum Beispiel die aktuelle Aufgabe.</p>
      <div class="row nowrap">
        <input type="text" value="${esc(store.message)}" data-input="message" placeholder="z. B. Buch S. 34, Nr. 2 a bis c" aria-label="Hinweis am Beamer">
        <button class="btn ghost" data-action="message-clear">Leeren</button>
      </div>
    </section>
  </div>`;
}

function pageZufall(c) {
  if (!c) return emptyState();
  const today = todayKey(), pool = presentStudents(c);
  const open = pool.filter(s => !c.pick.drawn.includes(s.id)).sort(byFirst);
  const hist = c.pick.history.slice(0, 12).map(h => ({ h, s: c.students.find(x => x.id === h.id) })).filter(x => x.s);
  return `
  <div class="page-head"><div><h1>Zufall</h1><p class="lead">Zieht einen Namen aus allen anwesenden SuS von ${esc(c.name)}. Am Beamer läuft dazu eine kurze Auslosung.</p></div></div>
  <div class="grid">
    ${pickPanel(c, 's7', true)}
    <section class="panel s5">
      <div class="panel-head"><h2>Runde</h2></div>
      <label class="check"><input type="checkbox" data-change="pick-norepeat" ${store.settings.pickNoRepeat ? 'checked' : ''}><span>Ohne Wiederholung: Alle kommen einmal dran, bevor jemand zum zweiten Mal gezogen wird.</span></label>
      ${store.settings.pickNoRepeat ? `<h3>Noch nicht dran (${open.length})</h3><p class="namelist">${open.map(s => esc(fullName(s))).join(', ') || 'Alle waren dran.'}</p><button class="btn" data-action="pick-reset">Runde neu starten</button>` : ''}
      ${hist.length ? `<h3>Zuletzt gezogen</h3><ul class="hist">${hist.map(({ h, s }) => `<li><time>${new Date(h.t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</time><span>${esc(fullName(s))}</span></li>`).join('')}</ul>` : ''}
    </section>
    <section class="panel s12">
      <div class="panel-head"><h2>Anwesenheit heute</h2><button class="btn ghost" data-action="all-present">Alle anwesend</button></div>
      <div class="presence">${[...c.students].sort(byFirst).map(s => `<button class="chip" data-action="toggle-absent" data-id="${s.id}" aria-pressed="${s.absentOn !== today}">${esc(fullName(s))}</button>`).join('') || '<span class="muted">Noch keine SuS in dieser Klasse.</span>'}</div>
      <p class="muted small">Durchgestrichene Namen sind abwesend und werden beim Ziehen übersprungen. Die Markierung gilt nur für heute.</p>
    </section>
  </div>`;
}

function pageTimer() {
  const t = store.timer;
  return `
  <div class="page-head"><div><h1>Timer</h1><p class="lead">Der Timer läuft groß auf dem Beamer. Ist die Zeit um, ertönt ein Gong.</p></div></div>
  <div class="grid">
    ${timerPanel('s7', true)}
    <section class="panel s5">
      <div class="panel-head"><h2>Eigene Zeit</h2></div>
      <form class="row" data-submit="timer-custom" style="align-items:flex-end">
        <label class="field"><span>Minuten</span><input class="num" type="number" name="min" min="0" max="360" value="${Math.floor(t.durationSec / 60)}"></label>
        <label class="field"><span>Sekunden</span><input class="num" type="number" name="sec" min="0" max="59" value="${t.durationSec % 60}"></label>
        <button class="btn primary">Zeit übernehmen</button>
      </form>
      <h3>Titel am Beamer</h3>
      <input type="text" value="${esc(t.label)}" data-input="timer-label" placeholder="z. B. Stillarbeit" aria-label="Titel am Beamer">
      <div class="row" style="margin-top:16px">
        <label class="check"><input type="checkbox" data-change="set-bool" data-key="sound" ${store.settings.sound ? 'checked' : ''}><span>Gong am Ende</span></label>
        <button class="btn ghost" data-action="gong-test">Gong testen</button>
      </div>
    </section>
  </div>`;
}

function pageLaut() {
  const s = store.settings.noise, n = rt.noise;
  const range = (key, label, min, max, step, value, out) => `<label class="range-row"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${value}" data-input="${key}"><output data-out="${key}">${out}</output></label>`;
  return `
  <div class="page-head"><div><h1>Lautstärke</h1><p class="lead">Das Mikrofon misst den Pegel im Raum. Die Ampel springt erst um, wenn es eine Weile zu laut ist. Ein einzelnes lautes Geräusch zählt also nicht.</p></div></div>
  <div class="grid">
    <section class="panel s12">
      <div class="panel-head"><h2>Live</h2>${sourceSeg()}</div>
      <div class="laut-row">
        ${miniAmpel(true)}
        <div class="laut-meter">
          <div class="laut-value"><span data-live="noise-value">–</span><span class="muted">Pegel von 0 bis 100</span></div>
          ${meterHTML(true)}
          <div class="meter-scale"><span>leise</span><span>laut</span></div>
          ${micWarnHTML()}
        </div>
      </div>
      <p class="muted small">${noiseHint()}</p>
      <div class="row">
        <button class="btn" data-action="calibrate" data-live="calib" ${n.source === 'mic' ? '' : 'disabled'}>${rt.calib ? 'Messe …' : 'Grundpegel messen (5 Sek.)'}</button>
        <span class="muted small">Miss, während die Klasse in angemessener Lautstärke arbeitet. Gelb und Rot werden danach passend gesetzt.</span>
      </div>
    </section>
    <section class="panel s7">
      <div class="panel-head"><h2>Schwellen</h2></div>
      ${range('th-yellow', 'Gelb ab', 5, 95, 1, s.yellow, s.yellow)}
      ${range('th-red', 'Rot ab', 8, 100, 1, s.red, s.red)}
      ${range('sens', 'Empfindlichkeit', -20, 20, 1, s.sensitivity, (s.sensitivity > 0 ? '+' : '') + s.sensitivity)}
      ${range('tol', 'Geduld vor Rot', 0, 10, .5, s.toleranceSec, fmtNum(s.toleranceSec) + ' Sek.')}
    </section>
    <section class="panel s5">
      <div class="panel-head"><h2>Tipps</h2></div>
      <ul class="tips">
        <li>Stell den Laptop möglichst mittig in den Raum, nicht direkt neben eine laute Gruppe.</li>
        <li>Zeigt die Ampel ständig Rot, senke die Empfindlichkeit oder miss den Grundpegel neu.</li>
        <li>Ohne Mikrofon kannst du die Ampel im Modus Manuell selbst schalten. Die Sterne zählen trotzdem.</li>
      </ul>
      <label class="check"><input type="checkbox" data-change="noise-showlevel" ${s.showLevel ? 'checked' : ''}><span>Pegelbalken neben der Ampel am Beamer zeigen</span></label>
    </section>
    <section class="panel s12">
      <details class="diag" data-diag ${rt.diagOpen ? 'open' : ''}><summary>Mikrofon-Diagnose</summary>
        <p class="muted small">Zeigt, was beim Mikrofon ankommt. Hilfreich, wenn die Ampel nicht reagiert.</p>
        <pre data-live="diag"></pre>
      </details>
    </section>
  </div>`;
}

function pageKarten(c) {
  if (!c) return emptyState();
  const range = rt.cardRange, counts = cardCountsMap(c.id, range);
  const log = store.cards.filter(k => k.classId === c.id && inRange(k.t, range)).sort((a, b) => b.t - a.t);
  const nameOf = id => { const s = c.students.find(x => x.id === id); return s ? fullName(s) : 'Entfernte Person'; };
  const cell = v => v ? v : '<span class="zero">0</span>';
  return `
  <div class="page-head">
    <div><h1>Karten</h1><p class="lead">Lob, gelbe und rote Karten mit Notizen für ${esc(c.name)}. Notizen erscheinen nie am Beamer.</p></div>
    <div class="row">${seg('card-range', [['today', 'Heute'], ['week', 'Diese Woche'], ['all', 'Alle']], range)}<button class="btn" data-action="cards-export" ${log.length ? '' : 'disabled'}>Als CSV exportieren</button></div>
  </div>
  <div class="grid">
    <section class="panel s5">
      <table class="tbl">
        <thead><tr><th>Name</th><th class="num">Lob</th><th class="num">Gelb</th><th class="num">Rot</th></tr></thead>
        <tbody>${[...c.students].sort(byLast).map(s => { const k = counts[s.id] || {}; return `<tr><td><button class="link" data-action="student" data-id="${s.id}">${esc(fullName(s))}</button></td><td class="num">${cell(k.green)}</td><td class="num">${cell(k.yellow)}</td><td class="num">${cell(k.red)}</td></tr>`; }).join('') || '<tr><td colspan="4" class="muted">Noch keine SuS.</td></tr>'}</tbody>
      </table>
    </section>
    <section class="panel s7">
      <div class="panel-head"><h2>Verlauf</h2><span class="muted small">${log.length} ${log.length === 1 ? 'Eintrag' : 'Einträge'}</span></div>
      ${log.length ? `<ul class="log">${log.map(k => `<li>
        <span class="badge ${k.type}" aria-hidden="true"></span>
        <div class="log-main"><div><strong>${esc(nameOf(k.studentId))}</strong> <span class="muted small">${CARD[k.type].long}, ${fmtWhen(k.t)}</span></div>${k.note ? `<div class="log-note">${esc(k.note)}</div>` : ''}</div>
        <button class="btn ghost small" data-action="card-delete" data-id="${k.id}">Löschen</button>
      </li>`).join('')}</ul>` : '<p class="muted">Keine Einträge im gewählten Zeitraum. Karten vergibst du über einen Klick auf einen Namen.</p>'}
    </section>
  </div>`;
}

function pageSterne(c) {
  if (!c) return emptyState();
  const st = store.settings, r = c.reward, w = r.weeks[weekKey()] || { stars: 0, activeSec: 0, greenSec: 0 };
  const quiet = w.activeSec >= 60 ? Math.round(w.greenSec / w.activeSec * 100) + ' %' : '–';
  const liga = ligaRows(), mps = st.minutesPerStar;
  return `
  <div class="page-head"><div><h1>Sterne</h1><p class="lead">Solange die Ampel grün ist, füllt sich der Stern. Nach ${mps} ${mps === 1 ? 'Minute' : 'Minuten'} Grün bekommt die Klasse einen Stern. Mit genug Sternen erreicht sie ihr Klassenziel.</p></div></div>
  <div class="grid">
    <section class="panel s7">
      <div class="panel-head"><h2>${esc(c.name)}</h2></div>
      ${starsBlock(c)}
      <dl class="stats">
        <div><dt>Diese Woche</dt><dd>${w.stars}</dd></div>
        <div><dt>Ruhequote</dt><dd>${quiet}</dd></div>
        <div><dt>Aktuelle Serie</dt><dd data-live="streak">0:00</dd></div>
        <div><dt>Ruhe-Rekord</dt><dd data-live="best">${fmtDur(r.bestStreakSec)}</dd></div>
      </dl>
    </section>
    <section class="panel s5">
      <div class="panel-head"><h2>Klassenziel</h2></div>
      <div class="stack">
        <label class="field"><span>Sterne bis zur Belohnung (0 = kein Ziel)</span><input class="num" type="number" min="0" max="500" value="${r.goal.target}" data-change="goal-target"></label>
        <label class="field"><span>Belohnung</span><input type="text" value="${esc(r.goal.reward)}" data-change="goal-reward" placeholder="z. B. 10 Minuten Spiel am Freitag"></label>
        <p class="muted small">${r.goal.reachedAt ? `Erreicht am ${new Date(r.goal.reachedAt).toLocaleDateString('de-DE')}. Starte das Ziel neu, wenn die Belohnung eingelöst ist.` : 'Das Ziel zählt alle Sterne seit dem letzten Neustart.'}</p>
        <div><button class="btn" data-action="goal-restart">Ziel neu starten</button></div>
      </div>
    </section>
    <section class="panel s7">
      <div class="panel-head"><h2>Regeln</h2></div>
      <div class="setting"><span>Minuten Grün pro Stern</span>
        <div class="row"><input class="num" type="number" min="1" max="60" value="${mps}" data-change="mps" aria-label="Minuten pro Stern">${[2, 3, 5, 10].map(m => `<button class="chip" data-action="mps-set" data-val="${m}" aria-pressed="${mps === m}">${m} Min.</button>`).join('')}</div>
      </div>
      <div class="setting"><span>Bei Gelb</span>${seg('set', [['pause', 'Stern wartet'], ['count', 'Stern füllt sich weiter']], st.yellowPolicy, 'data-key="yellowPolicy"')}</div>
      <div class="setting"><span>Bei Rot</span>${seg('set', [['pause', 'Stern wartet'], ['reset', 'Stern fängt von vorn an'], ['minus', 'Ein Stern weniger']], st.redPolicy, 'data-key="redPolicy"')}</div>
      <p class="muted small">Rot zählt nur, wenn es länger laut bleibt. Die Geduld stellst du unter Lautstärke ein.</p>
    </section>
    <section class="panel s5">
      <div class="panel-head"><h2>Klassen-Liga</h2><button class="btn" data-action="liga-show" ${liga.length > 1 ? '' : 'disabled'}>Am Beamer zeigen</button></div>
      ${liga.length > 1 ? `
        ${seg('set', [['stars', 'Sterne'], ['rate', 'Pro 45 Minuten']], st.ligaMode, 'data-key="ligaMode"')}
        <table class="tbl" style="margin-top:12px"><thead><tr><th>Platz</th><th>Klasse</th><th class="num">Sterne</th><th class="num">je 45 Min.</th></tr></thead>
        <tbody>${liga.map((x, i) => `<tr ${x.id === c.id ? 'style="font-weight:700"' : ''}><td>${i + 1}.</td><td>${esc(x.name)}</td><td class="num">${x.stars}</td><td class="num">${x.rate ? fmtNum(x.rate) : '–'}</td></tr>`).join('')}</tbody></table>
        <p class="muted small" style="margin-top:10px">Die Liga zählt die Sterne der aktuellen Kalenderwoche (KW ${weekNo()}). Pro 45 Minuten ist fairer, wenn du Klassen unterschiedlich oft hast.</p>`
      : '<p class="muted">Sobald du mindestens zwei Klassen hast, treten sie hier wöchentlich gegeneinander an.</p>'}
    </section>
    <section class="panel s12">
      <div class="row"><button class="btn danger" data-action="stars-reset">Alle Sterne von ${esc(c.name)} zurücksetzen</button><span class="muted small">Löscht Sterne, Wochenwerte und Rekord dieser Klasse.</span></div>
    </section>
  </div>`;
}

function importPreview() {
  const imp = rt.imp, recs = importRecords();
  const fileClasses = [...new Set(recs.map(r => r.cls).filter(Boolean))];
  const canColumn = imp.map.includes('class');
  if (imp.target === 'column' && !canColumn) imp.target = activeClass() ? 'existing' : 'new';
  if (imp.target === 'existing' && !store.classes.length) imp.target = 'new';
  const sample = recs.slice(0, 4).map(r => esc([r.first, r.last].filter(Boolean).join(' '))).join(', ');
  return `<div class="imp">
    <h3>Vorschau${imp.fileName ? ` von ${esc(imp.fileName)}` : ''}</h3>
    <p class="muted small">Lege für jede Spalte fest, was sie enthält.</p>
    <div class="table-wrap"><table class="imp-table">
      <thead><tr>${imp.map.map((role, i) => `<th><select class="input" data-change="imp-map" data-col="${i}" aria-label="Inhalt von Spalte ${i + 1}">${ROLE_OPTIONS.map(([v, l]) => `<option value="${v}" ${v === role ? 'selected' : ''}>${l}</option>`).join('')}</select></th>`).join('')}</tr></thead>
      <tbody>${imp.rows.slice(0, 7).map((r, ri) => `<tr class="${ri === 0 && imp.hasHeader ? 'is-head' : ''}">${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    ${imp.rows.length > 7 ? `<p class="muted small">und ${imp.rows.length - 7} weitere Zeilen</p>` : ''}
    <div class="row">
      <label class="check"><input type="checkbox" data-change="imp-header" ${imp.hasHeader ? 'checked' : ''}><span>Erste Zeile ist eine Überschrift</span></label>
      <button class="btn ghost" data-action="imp-swap">Vor- und Nachname tauschen</button>
    </div>
    <p style="margin-top:12px">So werden die Namen übernommen: <strong>${sample || 'keine Namen erkannt'}</strong>${recs.length > 4 ? ' …' : ''}</p>
    <fieldset class="targets"><legend>Wohin sollen die Namen?</legend>
      ${canColumn ? `<label class="check"><input type="radio" name="imp-target" value="column" data-change="imp-target" ${imp.target === 'column' ? 'checked' : ''}><span>In die Klassen aus der Datei${fileClasses.length ? ` (${fileClasses.map(esc).join(', ')})` : ''}</span></label>` : ''}
      ${store.classes.length ? `<label class="check"><input type="radio" name="imp-target" value="existing" data-change="imp-target" ${imp.target === 'existing' ? 'checked' : ''}><span>In die Klasse</span><select class="input" data-change="imp-class" aria-label="Bestehende Klasse">${store.classes.map(k => `<option value="${k.id}" ${k.id === imp.classId ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select></label>` : ''}
      <label class="check"><input type="radio" name="imp-target" value="new" data-change="imp-target" ${imp.target === 'new' ? 'checked' : ''}><span>In eine neue Klasse</span><input type="text" value="${esc(imp.newName)}" data-input="imp-newname" placeholder="Name, z. B. 7b" aria-label="Name der neuen Klasse"></label>
    </fieldset>
    <div class="row">
      <button class="btn primary" data-action="imp-run" ${recs.length ? '' : 'disabled'}>${recs.length} SuS importieren</button>
      <button class="btn ghost" data-action="imp-cancel">Abbrechen</button>
    </div>
  </div>`;
}

function pageKlassen() {
  const c = activeClass();
  return `
  <div class="page-head"><div><h1>Klassen</h1><p class="lead">Lege Klassen an oder importiere eine Namensliste. Welche Klasse gerade aktiv ist, wählst du oben in der Leiste.</p></div></div>
  <div class="grid">
    <section class="panel s5">
      <div class="panel-head"><h2>Deine Klassen</h2></div>
      ${store.classes.length ? `<ul class="class-list">${store.classes.map(k => `<li class="${k.id === store.activeClassId ? 'active' : ''}"><button class="class-item" data-action="class-activate" data-id="${k.id}"><strong>${esc(k.name)}</strong><span class="muted small">${k.students.length} SuS</span></button></li>`).join('')}</ul>` : '<p class="muted">Noch keine Klasse angelegt.</p>'}
      <form class="row nowrap" data-submit="class-add">
        <input type="text" name="name" placeholder="z. B. 7b oder Mathe Q1" aria-label="Name der neuen Klasse" required>
        <button class="btn primary">Klasse anlegen</button>
      </form>
      ${store.classes.length ? '' : '<p style="margin-top:14px"><button class="btn ghost" data-action="demo">Beispielklasse laden</button></p>'}
    </section>
    <section class="panel s7">
      <div class="panel-head"><h2>CSV importieren</h2><button class="btn ghost" data-action="sample-csv">Beispiel-CSV herunterladen</button></div>
      <label class="drop">
        <input type="file" accept=".csv,.txt,text/csv,text/plain" data-change="csv-file" hidden>
        <strong>CSV-Datei hierher ziehen</strong>
        <span class="muted">oder klicken und Datei auswählen</span>
      </label>
      <details ${rt.pasteOpen ? 'open' : ''}><summary>Namen stattdessen einfügen</summary>
        <textarea id="pasteArea" rows="5" placeholder="Eine Person pro Zeile, z. B. direkt aus Excel kopiert"></textarea>
        <button class="btn" data-action="csv-paste">Vorschau zeigen</button>
      </details>

/* ---------- Zufallsfragen und Bühne: Panels ---------- */
function questionPanel(span, big = false) {
  const b = activeBox(), s = store.stage && store.stage.kind === 'question' ? store.stage : null;
  const cur = s && store.qboxes.find(x => x.id === s.boxId), q = cur && cur.items.find(x => x.id === s.qid);
  const left = b && b.noRepeat && b.items.length ? `<span class="muted small">${b.items.length - b.drawn.length} von ${b.items.length} offen</span>` : '';
  let body;
  if (!store.qboxes.length) {
    body = `<p class="muted">Lege eine Fragenbox an und füge deine Fragen ein. Dann ziehst du hier per Knopfdruck eine Zufallsfrage.</p>
      <div class="row"><button class="btn primary" data-action="nav" data-page="fragen">Fragenbox anlegen</button><button class="btn ghost" data-action="q-demo">Beispielbox laden</button></div>`;
  } else {
    body = `${store.qboxes.length > 1
      ? `<label class="field q-pick"><span>Fragenbox</span><select class="input" data-change="q-box-select">${store.qboxes.map(x => `<option value="${x.id}" ${x.id === store.activeBoxId ? 'selected' : ''}>${esc(x.name)} (${x.items.length})</option>`).join('')}</select></label>`
      : `<p class="muted small">Fragenbox: <strong>${esc(b.name)}</strong></p>`}
      <div class="q-current ${big ? 'big' : ''} ${q ? '' : 'empty'} ${rt.qFlash ? 'pop' : ''}">${q ? esc(q.q) : 'Noch keine Frage gezogen.'}</div>
      ${q && q.a ? `<div class="q-ans"><span>Antwort${s.showAnswer ? ', am Beamer sichtbar' : ', nur für dich'}</span>${esc(q.a)}</div>` : ''}
      <div class="row">
        <button class="btn primary ${big ? 'lg' : ''}" data-action="q-draw" ${b && b.items.length ? '' : 'disabled'}>${icon('question')}Frage ziehen <kbd>Q</kbd></button>
        ${q && q.a ? `<button class="btn" data-action="q-answer">${s.showAnswer ? 'Antwort verbergen' : 'Antwort am Beamer zeigen'}</button>` : ''}
        ${s ? '<button class="btn ghost" data-action="stage-hide">Am Beamer ausblenden</button>' : ''}
      </div>`;
  }
  return `<section class="panel ${span} qpanel">
    <div class="panel-head"><h2>Zufallsfrage</h2><div class="row">${left}${s ? focusBtn('stage') : ''}</div></div>
    ${body}
  </section>`;
}

const scrollCtl = () => `<div class="row stage-ctl"><span class="muted small">Scrollen</span>
  <button class="btn icon-only" data-action="stage-scroll" data-d="-1" aria-label="Nach oben">${icon('up')}</button>
  <button class="btn icon-only" data-action="stage-scroll" data-d="1" aria-label="Nach unten">${icon('down')}</button>
  <button class="btn ghost small" data-action="stage-scroll" data-d="0">Zum Anfang</button></div>`;

function stageControls(d, s) {
  const zseg = opts => seg('stage-zoom', opts.map(([v, l]) => [String(v), l]), String(s.zoom));
  switch (d.cat) {
    case 'pdf':
      if (s.native) return '<p class="muted small">Ohne Internetverbindung zeigt der Beamer die PDF im Browser-Viewer. Blättern geht dann direkt im Beamer-Fenster.</p>';
      return `<div class="row stage-ctl">
          <button class="btn icon-only" data-action="stage-page" data-d="-1" aria-label="Vorige Seite" ${s.page <= 1 ? 'disabled' : ''}>${icon('left')}</button>
          <span class="stage-page">Seite ${s.page}${s.pages ? ' von ' + s.pages : ''}</span>
          <button class="btn icon-only" data-action="stage-page" data-d="1" aria-label="Nächste Seite" ${s.pages && s.page >= s.pages ? 'disabled' : ''}>${icon('right')}</button>
          ${zseg([['page', 'Ganze Seite'], ['width', 'Seitenbreite']])}
        </div>
        ${s.zoom === 'width' ? scrollCtl() : ''}
        <p class="muted small">Blättern geht auch mit den Pfeiltasten oder einem Presenter.</p>`;
    case 'image':
      return `<div class="row stage-ctl">${zseg([[1, 'Einpassen'], [1.5, '150 %'], [2, '200 %']])}</div>`;
    case 'web':
      return `<div class="row stage-ctl">${zseg([[1, '100 %'], [1.25, '125 %'], [1.5, '150 %'], [2, '200 %']])}</div>
        <div class="row stage-ctl"><button class="btn" data-action="stage-reload">Neu laden</button><button class="btn" data-action="web-window" data-id="${d.id}">In eigenem Fenster öffnen</button><button class="btn" data-action="screen-share">${icon('share')}Fenster teilen</button></div>
        <p class="muted small">Bleibt die Fläche am Beamer leer oder zeigt einen Fehler, erlaubt die Seite keine Einbettung (zum Beispiel Moodle oder Banken). Öffne sie dann in einem eigenen Fenster oder teile das Fenster.</p>`;
    case 'html':
      return `<div class="row stage-ctl">${zseg([[1, '100 %'], [1.25, '125 %'], [1.5, '150 %'], [2, '200 %']])}<button class="btn" data-action="stage-reload">Neu laden</button></div>`;
    case 'video': case 'audio':
      return `<div class="row stage-ctl"><button class="btn primary" data-action="stage-play">${icon(s.paused ? 'play' : 'pause')}${s.paused ? 'Abspielen' : 'Pause'}</button><button class="btn" data-action="stage-restart">Von vorn</button></div>
        <p class="muted small">Startet das Video ohne Ton, klicke einmal ins Beamer-Fenster und schalte den Ton dort ein.</p>`;
    case 'docx': case 'text':
      return `<div class="row stage-ctl"><span class="muted small">Schrift</span>${zseg([[1, '100 %'], [1.25, '125 %'], [1.5, '150 %'], [2, '200 %']])}</div>${scrollCtl()}`;
    case 'note':
      return `<label class="field"><span>Text, ändert sich am Beamer beim Tippen</span><textarea rows="5" data-input="note-live" data-id="${d.id}">${esc(d.text)}</textarea></label>
        <div class="row stage-ctl" style="margin-top:10px"><span class="muted small">Schrift</span>${zseg([[0.8, '80 %'], [1, '100 %'], [1.25, '125 %'], [1.5, '150 %']])}</div>${scrollCtl()}`;
    case 'screen':
      return '<p class="muted">Klicke am Beamer auf „Fenster auswählen“ und wähle einen Tab oder ein Fenster. Was du dort machst, erscheint live am Beamer. So zeigst du auch Seiten, die sich nicht einbetten lassen.</p>';
  }
  return '';
}

const recentMedia = n => [...store.media].sort((a, b) => (b.used || b.t) - (a.used || a.t)).slice(0, n);

    </section>`;

  return `<section class="panel ${span} stage-panel">${head}
    <div class="stage-title">${icon(catIcon(d.cat))}<strong>${esc(d.name)}</strong><span class="muted small">${CAT_NAMES[d.cat] || ''}</span></div>

/* ---------- Check-in, Check-out und Sessionmarkt: Seiten ---------- */
const BOARD_LEAD = {
  checkin: 'Starte gemeinsam in die Stunde: Stimmung abfragen, die Lernstrategie des Tages vorstellen, Erwartungen sammeln und den Plan für heute zeigen. An einem Touch-Display tippen die SuS selbst, sonst trägst du ihre Antworten hier ein.',
  checkout: 'Schließe die Stunde gemeinsam ab: Zufriedenheit, Lichtblicke, drei Reflexionsfragen, nächste Schritte und eine Abschlussumfrage per QR-Code.',
};
function boardDesc(kind) {
  const c = activeClass(), b = boardOf(kind);
  if (!b) return null;
  return {
    kind: 'board', board: kind, title: b.title, view: b.view, input: b.input, moderate: b.moderate,
    sections: b.sections.filter(x => x.on).map(x => {
      if (x.type === 'scale') return { id: x.id, type: 'scale', q: x.q, low: x.low, high: x.high, n: sum(x.votes), votes: x.hide ? null : x.votes };
      if (x.type === 'wall') return { id: x.id, type: 'wall', q: x.q, hint: x.hint, color: x.color, cards: x.cards.filter(k => !k.hidden).map(k => ({ id: k.id, text: k.text })) };
      if (x.type === 'list') return { id: x.id, type: 'list', q: x.q, checks: x.checks, items: x.items.map(i => ({ label: i.label, text: i.text, done: i.done })) };
      if (x.type === 'strategy') { const s = stratOf(x.sid); return { id: x.id, type: 'strategy', q: x.q, name: s ? s.name : '', text: s ? s.text : '', link: s ? s.link : '' }; }
      return { id: x.id, type: 'qr', q: x.q, text: x.text, url: x.url };
    }),
    className: c ? c.name : '',
  };
}

function secEditor(x, kind) {
  const dk = `data-kind="${kind}" data-sec="${x.id}"`;
  const edit = (field, label, ph = '') => `<label class="field"><span>${label}</span><input type="text" value="${esc(x[field])}" placeholder="${esc(ph)}" data-change="bd-sec-edit" data-field="${field}" ${dk}></label>`;
  let body = '';
  if (x.type === 'scale') {
    const n = sum(x.votes), max = Math.max(1, ...x.votes);
    body = `${edit('q', 'Frage')}
      <div class="two-in">${edit('low', 'Text bei 1')}${edit('high', 'Text bei 5')}</div>
      <div class="vote-grid">${x.votes.map((v, i) => `<div class="vote-cell" style="--p:${Math.round(v / max * 100)}%">
        <strong>${i + 1}</strong><span class="n">${v} ${v === 1 ? 'Stimme' : 'Stimmen'}</span>
        <div class="row"><button class="btn small" data-action="bd-vote" data-v="${i + 1}" data-d="-1" ${dk} aria-label="Eine Stimme weniger bei ${i + 1}" ${v ? '' : 'disabled'}>−</button><button class="btn small" data-action="bd-vote" data-v="${i + 1}" data-d="1" ${dk} aria-label="Eine Stimme mehr bei ${i + 1}">+</button></div>
      </div>`).join('')}</div>
      <p class="vote-sum"><strong>${n ? 'Ø ' + fmtNum(Math.round(voteAvg(x.votes) * 10) / 10) : 'Noch keine Stimmen'}</strong>${n ? ` aus ${n} ${n === 1 ? 'Stimme' : 'Stimmen'}` : '. Zähle per Handzeichen und tippe auf +, oder lass die SuS am Touch-Display abstimmen.'}</p>
      <div class="row"><label class="check small"><input type="checkbox" data-change="bd-sec-flag" data-field="hide" ${dk} ${x.hide ? 'checked' : ''}><span>Ergebnis am Beamer verdecken, bis ich es aufdecke</span></label>
      ${n ? `<button class="btn ghost small danger" data-action="bd-votes-reset" ${dk}>Stimmen löschen</button>` : ''}</div>`;
  } else if (x.type === 'wall') {
    const waiting = x.cards.filter(k => k.hidden).length;
    body = `${edit('q', 'Überschrift')}${edit('hint', 'Leitfrage für die SuS')}
      <form class="row nowrap" data-submit="bd-card-add" ${dk} style="margin-top:12px">
        <input type="text" name="text" maxlength="240" placeholder="Karte für die Wand schreiben" aria-label="Neue Karte">
        <button class="btn">Anheften</button>
      </form>
      ${waiting ? `<p class="small" style="margin:10px 0 0"><strong>${waiting} ${waiting === 1 ? 'Karte wartet' : 'Karten warten'} auf Freigabe.</strong> Mit dem Augen-Symbol zeigst du sie am Beamer.</p>` : ''}
      ${x.cards.length ? `<ul class="card-list c-${x.color}">${x.cards.map(k => `<li class="${k.hidden ? 'off' : ''}"><span>${esc(k.text)}</span>
        <button class="btn ghost small icon-only" data-action="bd-card-toggle" data-card="${k.id}" ${dk} title="${k.hidden ? 'Am Beamer zeigen' : 'Am Beamer verbergen'}" aria-label="${k.hidden ? 'Am Beamer zeigen' : 'Am Beamer verbergen'}">${icon(k.hidden ? 'eyeoff' : 'eye')}</button>
        <button class="btn ghost small icon-only" data-action="bd-card-del" data-card="${k.id}" ${dk} aria-label="Karte löschen">×</button></li>`).join('')}</ul>` : '<p class="muted small" style="margin-top:10px">Noch keine Karten.</p>'}`;
  } else if (x.type === 'list') {
    body = `${edit('q', 'Überschrift')}
      <label class="check small" style="margin:12px 0 8px"><input type="checkbox" data-change="bd-sec-flag" data-field="checks" ${dk} ${x.checks ? 'checked' : ''}><span>Punkte abhaken (zeigt den Fortschritt am Beamer)</span></label>
      <div class="list-rows">${x.items.map(it => `<div class="lr ${x.checks ? '' : 'nocheck'}">
        ${x.checks ? `<input type="checkbox" data-change="bd-item" data-field="done" data-item="${it.id}" ${dk} ${it.done ? 'checked' : ''} aria-label="Erledigt">` : ''}
        <input type="text" value="${esc(it.label)}" placeholder="${x.checks ? '08:00' : 'Wann'}" data-change="bd-item" data-field="label" data-item="${it.id}" ${dk} aria-label="Zeit oder Stichwort">
        <input type="text" value="${esc(it.text)}" placeholder="Was" data-change="bd-item" data-field="text" data-item="${it.id}" ${dk} aria-label="Beschreibung">
        <button class="btn ghost small" data-action="bd-item-del" data-item="${it.id}" ${dk} aria-label="Punkt löschen">×</button>
      </div>`).join('')}</div>
      <button class="btn small" data-action="bd-item-add" ${dk} style="margin-top:8px">+ Punkt</button>`;
  } else if (x.type === 'strategy') {
    const s = stratOf(x.sid), st = store.strats;
    body = `${edit('q', 'Überschrift')}
      <label class="field" style="margin-top:10px"><span>Strategie aus der Bibliothek</span><select class="input" data-change="bd-strat-select" ${dk}><option value="">Keine gewählt</option>${st.items.map(i => `<option value="${i.id}" ${i.id === x.sid ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}</select></label>
      <div class="row" style="margin-top:10px"><button class="btn primary small" data-action="strat-random" ${dk} ${st.items.length ? '' : 'disabled'}>${icon('dice')}Zufällig wählen</button><button class="btn small" data-action="nav" data-page="strategien">${icon('bulb')}Bibliothek</button></div>
      ${s ? `<div class="strat-preview"><strong>${esc(s.name)}</strong><p>${esc(s.text)}</p>${s.link ? `<a href="${esc(s.link)}" target="_blank" rel="noopener">Mehr erfahren</a>` : ''}</div>`
        : '<p class="muted small" style="margin-top:10px">Wähle eine Strategie aus der Bibliothek oder lass den Zufall entscheiden. Ohne Strategie bleibt dieser Bereich am Beamer ausgeblendet.</p>'}`;
  } else {
    body = `${edit('q', 'Überschrift')}${edit('text', 'Text neben dem Code')}
      <label class="field"><span>Link</span><input type="text" value="${esc(x.url)}" placeholder="https://… zum Beispiel Moodle-Feedback oder Forms" data-change="bd-sec-url" ${dk} inputmode="url" spellcheck="false"></label>
      <div class="qr-row"><div class="qr-prev" data-qr="${esc(x.url)}">${x.url ? '' : '<span>Noch kein Link</span>'}</div>
      <p class="muted small">Ohne Link bleibt dieser Bereich am Beamer ausgeblendet. Den QR-Code erzeugt ein kleines Programm von jsDelivr, dafür braucht es Internet.</p></div>`;
  }
  return `<section class="panel s6 sec-ed ${x.on ? '' : 'sec-off'}">
    <div class="panel-head"><h2>${esc(secLabel(x))}</h2><div class="row">
      <label class="check small"><input type="checkbox" data-change="bd-sec-on" ${dk} ${x.on ? 'checked' : ''}><span>Aktiv</span></label>
      ${x.on && (secShown(x)) ? `<button class="btn small" data-action="bd-view" data-val="${x.id}" data-show="1" data-kind="${kind}">${icon('focus')}Groß zeigen</button>` : ''}
    </div></div>
    ${body}
  </section>`;
}

  return `
  <div class="page-head"><div><h1>${esc(b.title)}</h1><p class="lead">${BOARD_LEAD[kind]}</p></div>
    <div class="row">${on ? `${focusBtn('stage')}<button class="btn" data-action="stage-hide">Am Beamer ausblenden</button>` : `<button class="btn primary lg" data-action="board-show" data-kind="${kind}">${icon('screen')}Am Beamer zeigen</button>`}</div>
  </div>
  <div class="grid">
    <section class="panel s12">
      <div class="panel-head"><h2>${esc(b.title)} ${c ? 'für ' + esc(c.name) : 'ohne Klasse (allgemein, z. B. für Fortbildungen)'}</h2><span class="muted small">${boardStats(b)}</span></div>
      <div class="setting"><span>Ansicht am Beamer</span>${seg('bd-view', views, b.view, `data-kind="${kind}"`)}

      <div class="row">
        <label class="check"><input type="checkbox" data-change="bd-flag" data-kind="${kind}" data-field="input" ${b.input ? 'checked' : ''}><span>SuS tippen am Beamer selbst (Touch-Display oder interaktive Tafel)</span></label>
        <label class="check"><input type="checkbox" data-change="bd-flag" data-kind="${kind}" data-field="moderate" ${b.moderate ? 'checked' : ''}><span>Neue Karten erst nach meiner Freigabe zeigen</span></label>
      </div>
      <div class="row" style="margin-top:14px">

}
const pageCheckin = () => pageBoard('checkin');
const pageCheckout = () => pageBoard('checkout');

function mkSessionEditor(s, m) {
  const full = s.people.length >= s.cap, pct = Math.min(100, s.people.length / s.cap * 100);
  const ds = `data-sid="${s.id}"`;
  const person = (p, wait) => `<span class="mk-person ${wait ? 'wait' : ''}">${esc(p.name)}<button type="button" data-action="mk-remove" ${ds} data-pid="${p.id}" aria-label="${esc(p.name)} austragen">×</button></span>`;
  return `<div class="mk-edit ${full ? 'full' : ''}">
    <input type="text" class="title-in" value="${esc(s.title)}" placeholder="Titel der Session" data-change="mk-edit" data-field="title" ${ds} aria-label="Titel">
    <div class="mk-edit-row">
      <label class="field"><span>Leitung</span><input type="text" value="${esc(s.by)}" placeholder="z. B. Frau Brandt" data-change="mk-edit" data-field="by" ${ds}></label>
      <label class="field"><span>Raum</span><input type="text" value="${esc(s.room)}" placeholder="Raum 104" data-change="mk-edit" data-field="room" ${ds}></label>
      <label class="field"><span>Plätze</span><input type="number" min="1" max="999" value="${s.cap}" data-change="mk-edit" data-field="cap" ${ds}></label>
    </div>
    <div class="mk-edit-row two">
      <label class="field"><span>Runde</span><select class="input" data-change="mk-edit" data-field="roundId" ${ds}>${m.rounds.map(r => `<option value="${r.id}" ${r.id === s.roundId ? 'selected' : ''}>${esc(r.label)}</option>`).join('')}</select></label>
      <label class="field"><span>Link für QR-Code (optional)</span><input type="text" value="${esc(s.link)}" placeholder="https://…" data-change="mk-edit" data-field="link" ${ds} inputmode="url" spellcheck="false"></label>
    </div>
    <div class="mk-dash-count"><div class="bar mk"><span class="${full ? 'full' : pct >= 75 ? 'hi' : ''}" style="width:${pct}%"></span></div><strong>${s.people.length}/${s.cap}</strong></div>
    ${s.people.length ? `<div class="mk-people">${s.people.map(p => person(p, false)).join('')}</div>` : '<p class="muted small" style="margin:0">Noch niemand angemeldet.</p>'}
    ${s.wait.length ? `<p class="small" style="margin:0"><strong>Warteliste</strong></p><div class="mk-people">${s.wait.map(p => person(p, true)).join('')}</div>` : ''}
    <form class="row nowrap" data-submit="mk-signup" ${ds}>
      <input type="text" name="name" list="mkNames" placeholder="Name eintragen" aria-label="Name für ${esc(s.title)}" autocomplete="off">
      <button class="btn">${full ? 'Warteliste' : 'Anmelden'}</button>
    </form>
    <div><button class="btn ghost small danger" data-action="mk-session-del" ${ds}>Session löschen</button></div>
  </div>`;
}

function pageMarkt() {
